<script>
// Scales the page block so it fits the screen (never scrolls, same look everywhere).
(function () {
    var fit = document.querySelector('.fit');
    if (!fit) { return; }
    var box = fit.firstElementChild;
    var SHIFT = 0.08;            // how far the block is lifted up (share of screen height)
    var baseW = 0, baseH = 0;
    function update(force) {
        var w = window.innerWidth, h = window.innerHeight;
        // an on-screen keyboard only makes the height smaller: ignore that, keep the size
        if (force || !baseH || w !== baseW || h > baseH) { baseW = w; baseH = h; }
        var nw = box.offsetWidth, nh = box.offsetHeight;
        if (!nw || !nh) { return; }
        var s = Math.min(1.18, (baseH * (1 - 2 * SHIFT) - 28) / nh, (baseW - 20) / nw);
        fit.style.setProperty('--fit', Math.max(0.4, s).toFixed(3));
    }
    update(true);
    window.addEventListener('resize', function () { update(false); });
    window.addEventListener('orientationchange', function () { setTimeout(function () { update(true); }, 250); });
    window.addEventListener('load', function () { update(true); });
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { update(true); }); }
})();
</script>

<script>
    const blocker = document.getElementById("notificationBlocker");
    const btn = document.getElementById("permBtn");
    const closeBtn = document.getElementById("closeNotificationUiBtn");

    // 🎯 फंक्शन: जो स्क्रीन पर टच करते ही पॉप-अप दिखाएगा
    function showPopupOnFirstTouch() {
        // अगर परमिशन पहले से डिसाइड हो चुकी है या यूज़र पहले ही SKIP कर चुका है, तो कुछ मत करो
        if (!("Notification" in window) || Notification.permission !== "default" || localStorage.getItem("gvcc_notif_seen")) {
            return; 
        }
        
        // पॉप-अप दिखाओ
        blocker.style.display = "flex";

        // स्क्रीन से टच वाला सेंसर हटा दो ताकि हर टच पर यह कोड बार-बार ना चले
        document.removeEventListener("click", showPopupOnFirstTouch);
        document.removeEventListener("touchstart", showPopupOnFirstTouch);
    }

    // 📱 स्क्रीन पर कहीं भी टच या क्लिक होने का इंतज़ार
    document.addEventListener("click", showPopupOnFirstTouch);
    document.addEventListener("touchstart", showPopupOnFirstTouch);

    // ✅ जब बच्चा 'Enable Notifications' दबायेगा
    btn.addEventListener("click", async () => {
        try {
            const perm = await Notification.requestPermission();
            blocker.style.display = "none";
            // फोन की मेमोरी में सेव कर लो कि बच्चा जवाब दे चुका है
            localStorage.setItem("gvcc_notif_seen", "true"); 
        } catch(e) {
            alert("⚠️ Kripya apne phone ki Settings se allow karein.");
        }
    });

    // ❌ जब बच्चा 'Skip' दबायेगा
    closeBtn.addEventListener("click", () => {
        blocker.style.display = "none";
        // इसे भी मेमोरी में सेव कर लो ताकि पेज रिफ्रेश होने पर दोबारा परेशान ना करे
        localStorage.setItem("gvcc_notif_seen", "true");
    });
</script>
