<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>15 August Program - GVCC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CORE DASHBOARD STYLES */
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; overscroll-behavior-y: none; touch-action: manipulation; padding-bottom: 100px; }
        
        .page-exit { animation: zoomOutUp 0.4s forwards !important; }
        @keyframes zoomOutUp { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-10vh) scale(0.95); } }
        
        /* NAVBAR */
        .navbar { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff9933; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .nav-brand { font-size: 20px; font-weight: bold; background: linear-gradient(to right, #ff9933, #ffffff, #138808); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: #334155; color: white; border: 1px solid #475569; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; text-decoration: none; font-size: 14px; }
        .back-btn:active { transform: scale(0.95); background: #475569; }

        .container { max-width: 800px; margin: 20px auto; padding: 15px; text-align: center; }

        /* LIVE STATUS CARD WITH PROGRESS BAR */
        .status-card { background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 25px; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-card.playing { border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        .status-card h3 { margin: 0 0 10px 0; font-size: 16px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        #statusText { font-size: 20px; font-weight: bold; color: #f8fafc; margin: 0; }
        .equalizer { display: none; color: #10b981; margin-left: 10px; }
        .playing .equalizer { display: inline-block; }
        
        /* Progress Bar Styles */
        #progressContainer { display: none; margin-top: 15px; text-align: left; }
        .time-labels { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; font-weight: bold; margin-bottom: 5px; }
        .progress-bg { width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; height: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.1s linear; }

        /* CATEGORY TABS */
        .category-menu { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; justify-content: flex-start; scrollbar-width: none; }
        .category-menu::-webkit-scrollbar { display: none; }
        
        .cat-btn { background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .cat-btn:active { transform: scale(0.95); }
        .cat-btn.active { background: linear-gradient(135deg, #ff9933, #d87b22); color: white; border-color: #ff9933; box-shadow: 0 4px 15px rgba(255, 153, 51, 0.3); }
        .comedy-btn.active { background: linear-gradient(135deg, #ec4899, #be185d); border-color: #ec4899; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }

        /* STUDENT LIST (CARDS) */
        .program-section { display: none; animation: fadeInBlur 0.3s ease-out forwards; }
        .program-section.active { display: block; }
        
        @keyframes fadeInBlur { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .student-row { background: #1e293b; padding: 15px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; text-align: left; transition: 0.2s; }
        .student-row:active { transform: scale(0.98); background: rgba(255,255,255,0.02); }
        .student-info { display: flex; flex-direction: column; gap: 5px; }
        .student-name { font-size: 17px; font-weight: bold; color: #f8fafc; }
        .student-act { font-size: 13px; color: #38bdf8; font-weight: 600; }

        /* PLAY / PAUSE BUTTON STYLES */
        .play-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 12px 25px; font-weight: bold; font-size: 16px; border-radius: 10px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); display: flex; align-items: center; gap: 8px; width: 105px; justify-content: center; }
        .play-btn:active { transform: scale(0.92); }
        
        /* When music is playing, button turns orange and shows Pause */
        .play-btn.active-pause { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); border: 1px solid #fcd34d; }

        /* FLOATING STOP ALL BUTTON */
        .floating-stop-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.1); padding: 15px; box-sizing: border-box; z-index: 100; text-align: center; }
        .stop-btn { width: 100%; max-width: 400px; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; padding: 15px; font-weight: bold; font-size: 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); text-transform: uppercase; letter-spacing: 1px; }
        .stop-btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3); }
        
    </style>
</head>
<body>

    <!-- NAVBAR (Updated with right file name) -->
    <div class="navbar">
        <div class="nav-brand"><i class="fa-solid fa-flag"></i> 15 August Panel</div>
        <a href="teacher-dashboard.html" class="back-btn" onclick="navigateWithAnimation(event, this.href)"><i class="fa-solid fa-arrow-left"></i> Back</a>
    </div>

    <div class="container">
        
        <!-- LIVE STATUS CARD WITH PROGRESS BAR -->
        <div class="status-card" id="statusCard">
            <h3><i class="fa-solid fa-tower-broadcast"></i> Live Status</h3>
            <p id="statusText"><span style="color:#94a3b8;">No Music Playing</span> <i class="fa-solid fa-chart-bar fa-fade equalizer"></i></p>
            
            <!-- Music Timer & Progress Bar (Hidden by default) -->
            <div id="progressContainer">
                <div class="time-labels">
                    <span id="currentTimeDisplay">00:00</span>
                    <span id="durationDisplay">00:00</span>
                </div>
                <div class="progress-bg">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- CATEGORY MENU -->
        <div class="category-menu">
            <button class="cat-btn active" onclick="showCategory('class-6', this)">Class 6th</button>
            <button class="cat-btn" onclick="showCategory('class-7', this)">Class 7th</button>
            <button class="cat-btn" onclick="showCategory('class-8', this)">Class 8th</button>
        </div>

        <!-- CLASS 6TH PROGRAM (Testing with song.mp3) -->
        <div id="class-6" class="program-section active">
            
            <div class="student-row">
                <div class="student-info">
                    <span class="student-name">1. राजन कुमार</span>
                    <span class="student-act"><i class="fa-solid fa-person-walking"></i> Dance Performance</span>
                </div>
                <button class="play-btn" onclick="togglePlay('song.mp3', 'राजन कुमार (Dance)', this)"><i class="fa-solid fa-play"></i> Play</button>
            </div>

            <div class="student-row">
                <div class="student-info">
                    <span class="student-name">2. नंदनी कुमारी</span>
                    <span class="student-act"><i class="fa-solid fa-microphone-lines"></i> Patriotic Song</span>
                </div>
                <button class="play-btn" onclick="togglePlay('song.mp3', 'नंदनी कुमारी (Song)', this)"><i class="fa-solid fa-play"></i> Play</button>
            </div>
        </div>

        <!-- CLASS 7TH PROGRAM -->
        <div id="class-7" class="program-section">
            <div class="student-row">
                <div class="student-info">
                    <span class="student-name">1. नाजरीन परवीन</span>
                    <span class="student-act"><i class="fa-solid fa-person-walking"></i> Solo Dance</span>
                </div>
                <button class="play-btn" onclick="togglePlay('song.mp3', 'नाजरीन परवीन (Dance)', this)"><i class="fa-solid fa-play"></i> Play</button>
            </div>
        </div>

    </div>

    <!-- FLOATING STOP BUTTON -->
    <div class="floating-stop-bar">
        <button class="stop-btn" onclick="stopSong()"><i class="fa-solid fa-circle-stop"></i> Stop All Music</button>
    </div>

    <!-- HIDDEN AUDIO PLAYER -->
    <audio id="main-player"></audio>

    <script>
        // Page Exit Animation
        function navigateWithAnimation(event, url) { 
            event.preventDefault();
            document.body.classList.add('page-exit'); 
            setTimeout(() => { window.location.href = url; }, 300); 
        }

        var player = document.getElementById("main-player");
        var statusCard = document.getElementById("statusCard");
        var statusText = document.getElementById("statusText");
        var progressContainer = document.getElementById("progressContainer");
        var progressBar = document.getElementById("progressBar");
        
        let currentSongUrl = ""; // यह याद रखेगा कि अभी कौन सा गाना लोड है

        // Tab Switching Logic
        function showCategory(categoryId, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.program-section').forEach(sec => sec.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById(categoryId).classList.add('active');
        }

        // 🎵 MAIN LOGIC: Play / Pause Toggle
        function togglePlay(songUrl, studentName, clickedBtn) {
            
            // अगर वही गाना पहले से लोड है (Play/Pause Toggle)
            if (currentSongUrl === songUrl) {
                if (player.paused) {
                    player.play(); // Resume
                    setButtonToPause(clickedBtn);
                    statusCard.classList.add("playing");
                    statusText.innerHTML = studentName + ' <i class="fa-solid fa-chart-bar fa-fade equalizer"></i>';
                } else {
                    player.pause(); // Pause
                    setButtonToPlay(clickedBtn);
                    statusCard.classList.remove("playing");
                    statusText.innerHTML = '<span style="color:#f59e0b;"><i class="fa-solid fa-circle-pause"></i> Paused: ' + studentName + '</span>';
                }
                return;
            }

            // अगर कोई नया गाना प्ले किया जा रहा है:
            resetAllButtons();
            
            currentSongUrl = songUrl; // नया गाना सेट करो
            player.src = songUrl;
            player.play();
            
            setButtonToPause(clickedBtn);
            
            // UI Update (Progress bar दिखाएं)
            progressContainer.style.display = "block";
            statusCard.classList.add("playing");
            statusText.innerHTML = studentName + ' <i class="fa-solid fa-chart-bar fa-fade equalizer"></i>';
            statusText.style.color = "#10b981"; 
        }

        // 🔘 बटन का डिज़ाइन बदलने के फंक्शन्स
        function setButtonToPause(btn) {
            btn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
            btn.classList.add("active-pause");
        }

        function setButtonToPlay(btn) {
            btn.innerHTML = '<i class="fa-solid fa-play"></i> Play';
            btn.classList.remove("active-pause");
        }

        // 🔄 सब बटन्स को वापस 'Play' में बदलने का फंक्शन
        function resetAllButtons() {
            let allBtns = document.querySelectorAll('.play-btn');
            allBtns.forEach(btn => setButtonToPlay(btn));
        }

        // 🛑 Stop Song Function (सब कुछ रोकने के लिए)
        function stopSong() {
            player.pause();
            player.currentTime = 0; // गाने को शुरुआत में कर दो
            currentSongUrl = ""; // मेमोरी खाली कर दो
            
            resetAllButtons();
            
            // UI Hide
            progressContainer.style.display = "none";
            progressBar.style.width = "0%";
            statusCard.classList.remove("playing");
            statusText.innerHTML = '<span style="color:#ef4444;"><i class="fa-solid fa-ban"></i> Music Stopped</span>';
        }

        // ✅ जब गाना अपने आप खत्म हो जाए
        player.onended = function() {
            resetAllButtons();
            currentSongUrl = "";
            progressContainer.style.display = "none";
            statusCard.classList.remove("playing");
            statusText.innerHTML = '<span style="color:#38bdf8;"><i class="fa-solid fa-check-circle"></i> Performance Completed</span>';
        }

        // 🕒 TIMER & PROGRESS BAR LOGIC 🕒
        
        // टाइम को सही फॉर्मेट (MM:SS) में दिखाने का फंक्शन
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            return (min < 10 ? "0" : "") + min + ":" + (sec < 10 ? "0" : "") + sec;
        }

        // जैसे ही गाना लोड हो, टोटल टाइम दिखाओ
        player.addEventListener("loadedmetadata", function() {
            document.getElementById("durationDisplay").innerText = formatTime(player.duration);
        });

        // जैसे-जैसे गाना बजे, टाइम और प्रोग्रेस बार को बढ़ाओ
        player.addEventListener("timeupdate", function() {
            document.getElementById("currentTimeDisplay").innerText = formatTime(player.currentTime);
            
            if (player.duration) {
                let progressPercent = (player.currentTime / player.duration) * 100;
                progressBar.style.width = progressPercent + "%";
            }
        });

    </script>
</body>
</html>
