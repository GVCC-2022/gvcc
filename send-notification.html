<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Notification - GVCC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        
        .navbar { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0ea5e9; }
        .nav-brand { font-size: 20px; font-weight: bold; color: #0ea5e9; cursor: pointer; text-decoration: none; }
        
        .container { max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        h2 { text-align: center; color: #0ea5e9; margin-top: 0; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e1; font-weight: bold; font-size: 14px;}
        input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: #0f172a; color: white; box-sizing: border-box; font-family: inherit; font-size: 15px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0ea5e9; }
        
        .submit-btn { width: 100%; background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; padding: 16px; font-weight: bold; font-size: 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .submit-btn:active { transform: scale(0.96); }
        .submit-btn:disabled { background: #475569; cursor: not-allowed; }

        .status-box { margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 14px; display: none; text-align: center; font-weight: bold; }
        .status-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        .status-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="teacher-dashboard.html" class="nav-brand"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="container">
        <div class="card">
            <h2><i class="fa-solid fa-paper-plane"></i> Send Push Notification</h2>
            
            <div class="form-group">
                <label>Select Target Class</label>
                <select id="notiClass">
                    <option value="All">All Students</option>
                    <option value="10th">Class 10th</option>
                    <option value="9th">Class 9th</option>
                    <option value="8th">Class 8th</option>
                </select>
            </div>

            <div class="form-group">
                <label>Notification Title</label>
                <input type="text" id="notiTitle" placeholder="Ex: Naya Test Publish Ho Gaya Hai!" required>
            </div>

            <div class="form-group">
                <label>Message Body</label>
                <textarea id="notiBody" rows="4" placeholder="Ex: Sabhi bacche app khol kar History ka test dein..." required></textarea>
            </div>

            <button class="submit-btn" id="sendBtn" onclick="sendNotification()">
                <i class="fa-solid fa-bell"></i> Send to Mobile Phones
            </button>

            <div id="statusBox" class="status-box"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBJX_dyLK80p2rNqSVvGY67TpWV7e_UdPI", authDomain: "gvcc-database.firebaseapp.com", projectId: "gvcc-database", storageBucket: "gvcc-database.firebasestorage.app", messagingSenderId: "1063216875940", appId: "1:1063216875940:web:a4ee2f39b01896b44c5931" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        // ⚠️ ZAROORI: Yahan apni Firebase 'Server Key' daaliye (Cloud Messaging settings se nikalkar)
        const FCM_SERVER_KEY = "YOUR_SERVER_KEY_HERE"; 

        window.sendNotification = async function() {
            const targetClass = document.getElementById("notiClass").value;
            const title = document.getElementById("notiTitle").value.trim();
            const body = document.getElementById("notiBody").value.trim();
            const btn = document.getElementById("sendBtn");
            const statusBox = document.getElementById("statusBox");

            if(!title || !body) { alert("Please fill both title and message body."); return; }
            if(FCM_SERVER_KEY === "YOUR_SERVER_KEY_HERE") { alert("Developer Error: FCM Server Key is missing in the code!"); return; }

            btn.disabled = true;
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Processing...";
            statusBox.style.display = "none";

            try {
                statusBox.style.display = "block";
                statusBox.className = "status-box status-success";
                statusBox.innerText = "Fetching student tokens from database...";

                // 1. Fetch Students
                const querySnapshot = await getDocs(collection(db, "students"));
                let tokens = [];

                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let sClass = data["Class "] || data.Class || "";
                    
                    // Match class aur token dhoondho
                    if (targetClass === "All" || sClass.includes(targetClass.replace("th", ""))) {
                        if (data.fcmToken) tokens.push(data.fcmToken);
                        else if (data.token) tokens.push(data.token); 
                    }
                });

                if(tokens.length === 0) {
                    throw new Error("No tokens found for the selected class. Kisi bacche ne app install/allow nahi kiya hai.");
                }

                statusBox.innerText = `Found ${tokens.length} students. Sending notifications...`;

                // 2. Send via Firebase FCM API (Client side Hack)
                const response = await fetch('https://fcm.googleapis.com/fcm/send', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'key=' + FCM_SERVER_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        registration_ids: tokens, // Multiple logo ko ek sath bhejta hai
                        notification: {
                            title: title,
                            body: body,
                            sound: "default"
                        }
                    })
                });

                const result = await response.json();
                
                if (result.success > 0) {
                    statusBox.className = "status-box status-success";
                    statusBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> Success! Sent to ${result.success} devices.`;
                    document.getElementById("notiTitle").value = "";
                    document.getElementById("notiBody").value = "";
                } else {
                    throw new Error("API responded, but 0 messages were delivered. Token may be expired.");
                }

            } catch (error) {
                console.error(error);
                statusBox.className = "status-box status-error";
                statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Error: ${error.message}`;
            }

            btn.disabled = false;
            btn.innerHTML = "<i class='fa-solid fa-bell'></i> Send to Mobile Phones";
        }
    </script>
</body>
</html>
