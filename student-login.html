/* 🔥 VIP THEME VARIABLES 🔥 */
:root {
    --page-bg: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    --text-main: #1e293b;
    --card-bg: rgba(255, 255, 255, 0.6);
    --card-border: rgba(0, 0, 0, 0.1);
    --input-bg: rgba(255, 255, 255, 0.8);
    --input-text: #1e293b;
    --input-border: rgba(0, 0, 0, 0.15);
    --placeholder-color: #64748b;
    --divider-color: rgba(0, 0, 0, 0.1);
    --btn-login-bg: #ffffff;
    --btn-login-text: #0f172a;
    --btn-disabled-bg: rgba(0, 0, 0, 0.05);
    --btn-disabled-text: #94a3b8;
    --glow-color: rgba(56, 189, 248, 0.4);
    --credit-color: #475569;
}

[data-theme="dark"] {
    --page-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --text-main: white;
    --card-bg: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.1);
    --input-bg: rgba(255, 255, 255, 0.05);
    --input-text: white;
    --input-border: rgba(255, 255, 255, 0.1);
    --placeholder-color: #94a3b8;
    --divider-color: rgba(255, 255, 255, 0.1);
    --btn-login-bg: #ffffff;
    --btn-login-text: #0f172a;
    --btn-disabled-bg: rgba(255, 255, 255, 0.2);
    --btn-disabled-text: #94a3b8;
    --glow-color: rgba(255, 255, 255, 0.4);
    --credit-color: #64748b;
}

body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: var(--page-bg); 
    margin: 0; 
    padding: 50px 15px; 
    display: flex; justify-content: center; align-items: center; min-height: 100vh; 
    color: var(--text-main); 
    overflow-y: auto; 
    overflow-x: hidden;
    touch-action: manipulation; 
    transition: background 0.4s ease, color 0.4s ease; box-sizing: border-box;
}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.login-container { position: relative; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

.logo-glow-wrapper { 
    position: relative; width: 100%; height: 130px; display: flex; justify-content: center; align-items: center; 
    margin-bottom: -65px; 
    z-index: 10; 
    transform: translate(2px, 15px); 
}
.logo-glow-wrapper::before { content: ''; position: absolute; width: 140px; height: 140px; margin-top: 15px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, var(--glow-color) 0deg 3deg, transparent 3deg 10deg); -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 70%); mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 70%); animation: rotateRays 25s linear infinite; z-index: -1; transition: background 0.4s; }
.logo-glow-wrapper::after { content: ''; position: absolute; width: 90px; height: 90px; margin-top: 15px; border-radius: 50%; background: var(--glow-color); filter: blur(20px); z-index: -1; transition: background 0.4s; }
@keyframes rotateRays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.login-logo { width: 170px; height: auto; filter: drop-shadow(0px 8px 15px rgba(0, 0, 0, 0.5)); position: relative; z-index: 5; pointer-events: none; }

.login-card { background: var(--card-bg); backdrop-filter: blur(15px); padding: 80px 20px 20px 20px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border); width: 100%; text-align: center; box-sizing: border-box; position: relative; transition: background 0.4s, border 0.4s; }
.title { color: #38bdf8; font-size: 24px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 1px; }

/* 🔥 1. VIP SCAN BUTTON - HERO EFFECT 🔥 */
.btn-scan { 
    background: linear-gradient(135deg, #10b981, #059669) !important; 
    color: white !important; width: 100%; border: 2px solid #34d399; 
    padding: 16px; border-radius: 16px; font-size: 17px; font-weight: 900; 
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer; 
    display: flex; justify-content: center; align-items: center; gap: 10px; 
    position: relative; overflow: hidden;
    animation: vipPulse 2s infinite; 
    transition: transform 0.2s;
}
@keyframes vipPulse {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
    70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
.btn-scan::after {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(45deg); animation: shine 3s infinite; pointer-events: none;
}
@keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }

/* QR SCANNER CONTAINER */
#scanner-container { width: 100%; border-radius: 12px; overflow: hidden; display: none; border: 2px solid #10b981; margin-top: 10px; margin-bottom: 5px; background: #000; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
#reader { width: 100%; }
.stop-scan-btn { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; letter-spacing: 1px; font-size: 14px;}

.divider { display: flex; align-items: center; text-align: center; color: var(--placeholder-color); font-size: 11px; font-weight: 700; margin: 20px 0; }
.divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--divider-color); }
.divider:not(:empty)::before { margin-right: .5em; }
.divider:not(:empty)::after { margin-left: .5em; }

/* 🔥 2. LOGIN FORM & BUTTON - STANDARD SOLID 🔥 */
input { display: block; width: 100%; padding: 14px; margin: 12px auto; border: 1px solid var(--input-border); border-radius: 10px; font-size: 15px; box-sizing: border-box; transition: all 0.3s ease; background: var(--input-bg); color: var(--input-text); }
input::placeholder { color: var(--placeholder-color); }
input:focus { border-color: #38bdf8; background: var(--card-bg); box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); outline: none; }

.btn-login { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--btn-login-bg); color: var(--btn-login-text); padding: 14px; margin: 15px auto 5px auto; width: 100%; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
.btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); }
.btn-login:disabled { background: var(--btn-disabled-bg); color: var(--btn-disabled-text); cursor: not-allowed; box-shadow: none; }


/* 🔥 3. INSTALL APP BUTTON - CAPSULE / PILL SHAPE 🔥 */
.install-btn { 
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
    width: auto !important; 
    padding: 10px 25px !important; 
    background: linear-gradient(135deg, #0ea5e9, #2563eb) !important; 
    color: white !important; border: none !important; 
    border-radius: 50px !important; 
    font-size: 14px !important; font-weight: bold; cursor: pointer; 
    transition: all 0.3s ease; 
    margin: 15px auto 5px auto !important; 
    box-shadow: 0 6px 15px rgba(14, 165, 233, 0.3) !important; 
}
.install-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(14, 165, 233, 0.5) !important; }

/* THE MAGIC TAP FEEL */
.install-btn:active, .btn-login:active:not(:disabled), .btn-scan:active, .stop-scan-btn:active {

    opacity: 0.8; 
    transition: all 0.1s ease;

.install-btn i { animation: bounce 2s infinite; font-size: 16px; }

.credit-text { font-size: 11px; color: var(--credit-color); margin-top: 15px; font-weight: 500; letter-spacing: 0.5px; transition: color 0.4s; }
.spinner { width: 16px; height: 16px; border: 3px solid rgba(15, 23, 42, 0.3); border-top-color: #0f172a; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

#dynamicName.show { opacity: 1; transform: translateY(0); }
#msg { font-weight: 600; font-size: 13px; margin-top: 10px; transition: all 0.3s ease; text-shadow: 0 1px 2px rgba(0,0,0,0.1); min-height: 18px; }

@keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }

    // 🚀 SMART LOGGING
    async function saveLoginLog(rollNumber, studentName) {
        try {
            const now = new Date();
            const logRef = doc(db, "login_logs", rollNumber);
            await setDoc(logRef, {
                roll: rollNumber,
                name: studentName,
                totalLoginCount: increment(1), 
                lastLoginAt: now.toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }),
                history: arrayUnion({

                    timestamp: now.getTime()
                })
            }, { merge: true });
        } catch (error) {}
    }

    // 🔒 MANUAL LOGIN SYSTEM (Standard Box logic remains untouched)
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault(); 
        const loginBtn = document.getElementById("loginBtn"), btnSpinner = document.getElementById("btnSpinner"), btnText = document.getElementById("btnText");
        
        let roll = rollInput.value.trim(), password = document.getElementById("password").value.trim();

        loginBtn.disabled = true; btnSpinner.style.display = "block"; btnText.innerText = "Checking...";
        msgBox.style.color = "#fbbf24"; msgBox.innerHTML = "🔄 Verifying Credentials...";

        try {
            const docSnap = await getDoc(doc(db, "students", roll));
            if (docSnap.exists()) {
                let data = docSnap.data();
                if (String(data["Password "] || data.Password || data["password "]).trim() === String(password).trim()) {
                    
                    if ("Notification" in window && Notification.permission === "granted") {
                        try {
                            const token = await getToken(messaging, { vapidKey: VAPID_KEY });

                    msgBox.style.color = "#4ade80"; msgBox.innerHTML = "✅ Login Successful!";

        } catch (error) { msgBox.style.color = "#f87171"; msgBox.innerHTML = "⚠️ Network error."; resetButton(); }

        function resetButton() { loginBtn.disabled = false; btnSpinner.style.display = "none"; btnText.innerText = "Login"; }
