<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gyan Varsha Coaching Center - Student Login</title>
<link rel="icon" type="image/png" href="20260620_144347.png">
<meta name="description" content="ज्ञान वर्षा कोचिंग सेंटर (GVCC) का स्मार्ट स्टूडेंट पोर्टल। अपने रोल नंबर और पासवर्ड से सुरक्षित लॉगिन करें और अपना डैशबोर्ड देखें।">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
<!-- 🔥 CORE QR CODE LIBRARY (Direct Camera, No File Upload) 🔥 -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<!-- GLOBAL THEME SYSTEM -->
<link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');

* { -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: auto !important; -moz-user-select: auto !important; -ms-user-select: auto !important; user-select: auto !important; }
img { -webkit-user-drag: none; }

/* 🔥 VIP THEME VARIABLES 🔥 */
:root {
    --page-bg: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    --text-main: #1e293b;
    --card-bg: rgba(255, 255, 255, 0.8);
    --card-border: rgba(0, 0, 0, 0.1);
    --input-bg: rgba(255, 255, 255, 0.9);
    --input-text: #1e293b;
    --input-border: rgba(0, 0, 0, 0.15);
    --placeholder-color: #64748b;
    --divider-color: rgba(0, 0, 0, 0.1);
    --btn-login-bg: #1e293b;
    --btn-login-text: #ffffff;
    --glow-color: rgba(56, 189, 248, 0.4);
    --credit-color: #475569;
}

[data-theme="dark"] {
    --page-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --text-main: white;
    --card-bg: rgba(30, 41, 59, 0.6);
    --card-border: rgba(255, 255, 255, 0.08);
    --input-bg: rgba(15, 23, 42, 0.6);
    --input-text: white;
    --input-border: rgba(255, 255, 255, 0.1);
    --placeholder-color: #94a3b8;
    --divider-color: rgba(255, 255, 255, 0.1);
    --btn-login-bg: #ffffff;
    --btn-login-text: #0f172a;
    --glow-color: rgba(255, 255, 255, 0.3);
    --credit-color: #64748b;
}

body { 
    font-family: 'Poppins', sans-serif; 
    background: var(--page-bg); 
    margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
    color: var(--text-main); overflow: hidden; overscroll-behavior-y: none; touch-action: manipulation; 
    box-sizing: border-box;
}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

/* 📱 COMPACT MOBILE FIXES */
.login-container { position: relative; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.logo-glow-wrapper { position: relative; width: 100%; height: 110px; display: flex; justify-content: center; align-items: center; margin-bottom: -55px; z-index: 10; }
.login-logo { width: 135px; height: auto; filter: drop-shadow(0px 8px 15px rgba(0, 0, 0, 0.5)); position: relative; z-index: 5; pointer-events: none; }

.login-card { 
    background: var(--card-bg); backdrop-filter: blur(20px); 
    padding: 65px 20px 20px 20px; border-radius: 20px; 
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); 
    border: 1px solid var(--card-border); width: 100%; 
    text-align: center; box-sizing: border-box; position: relative; 
}

.title { color: #38bdf8; font-size: 20px; font-weight: 800; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 1px; }

/* 🌟 VIP SCAN BTN (Premium Large Button) */
.btn-scan { 
    background: linear-gradient(135deg, #fbbf24, #d4af37) !important; 
    color: #0f172a !important; width: 100%; border: none; padding: 16px; 
    border-radius: 14px; font-size: 16px; font-weight: 900; cursor: pointer; 
    display: flex; justify-content: center; align-items: center; gap: 10px; 
    transition: 0.3s; box-shadow: 0 8px 25px rgba(251, 191, 36, 0.35); 
    text-transform: uppercase; letter-spacing: 1px;
}
.btn-scan:hover { box-shadow: 0 10px 30px rgba(251, 191, 36, 0.5); transform: translateY(-2px); }
.btn-scan:active { transform: scale(0.95); }

/* QR SCANNER CONTAINER (Direct Camera) */
#scanner-container { width: 100%; border-radius: 14px; overflow: hidden; display: none; border: 3px solid #fbbf24; margin-bottom: 15px; background: #000; box-shadow: 0 10px 25px rgba(0,0,0,0.5);}
#reader { width: 100%; }
.stop-scan-btn { background: #ef4444; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; letter-spacing: 1px; font-size: 14px; }

.divider { display: flex; align-items: center; text-align: center; color: var(--placeholder-color); font-size: 10px; font-weight: 700; margin: 18px 0; text-transform: uppercase; letter-spacing: 1px;}
.divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--divider-color); }
.divider:not(:empty)::before { margin-right: .5em; }
.divider:not(:empty)::after { margin-left: .5em; }

/* NORMAL LOGIN FORM */
input { display: block; width: 100%; padding: 14px 15px; margin: 10px auto; border: 1px solid var(--input-border); border-radius: 12px; font-size: 14px; box-sizing: border-box; transition: all 0.3s ease; background: var(--input-bg); color: var(--input-text); font-family: 'Poppins', sans-serif;}
input::placeholder { color: var(--placeholder-color); font-weight: 500;}
input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); outline: none; }

.btn-login { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--btn-login-bg); color: var(--btn-login-text); padding: 14px; margin: 15px auto 5px auto; width: 100%; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
.btn-login:active { transform: scale(0.95); }

/* INSTALL APP (Secondary Slim Button) */
.install-btn { 
    display: flex; align-items: center; justify-content: center; gap: 8px; 
    width: 100%; padding: 10px; background: transparent !important; 
    color: #38bdf8 !important; border: 1.5px solid #38bdf8 !important; 
    border-radius: 10px !important; font-size: 13px !important; font-weight: bold; 
    cursor: pointer; transition: all 0.3s ease; margin-top: 15px !important; 
}
.install-btn:hover { background: rgba(56, 189, 248, 0.1) !important; }
.install-btn:active { transform: scale(0.95) !important; }

.credit-text { font-size: 10px; color: var(--credit-color); margin-top: 15px; font-weight: 600; letter-spacing: 0.5px; }

#dynamicName { font-size: 12px; color: #4ade80; margin: -5px auto 5px auto; font-weight: 700; width: 100%; text-align: left; height: 16px; opacity: 0; padding-left: 5px; transition: 0.3s;}
#dynamicName.show { opacity: 1; }
#msg { font-weight: 700; font-size: 13px; margin-top: 10px; min-height: 18px;}
</style>
</head>
<body>

<div class="login-container">
    <div class="logo-glow-wrapper"><img src="20260620_144347.png" alt="GVCC Logo" class="login-logo"></div>
    <div class="login-card">
        <div class="title"><i class="fa-solid fa-user-graduate"></i> Student Portal</div>
        
        <!-- 🔥 VIP SMART LOGIN SYSTEM 🔥 -->
        <button type="button" class="btn-scan" id="startScannerBtn" onclick="startQRScanner()">
            <i class="fa-solid fa-expand"></i> Tap to Scan VIP Pass
        </button>

        <div id="scanner-container">
            <div id="reader"></div>
            <button type="button" class="stop-scan-btn" onclick="stopQRScanner()"><i class="fa-solid fa-xmark"></i> Cancel Camera</button>
        </div>

        <div class="divider">Or Type Manual Code</div>

        <form id="loginForm">
            <input type="number" id="roll" placeholder="Roll Number" required>
            <div id="dynamicName"></div>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Secure Login <i class="fa-solid fa-arrow-right-to-bracket"></i></span>
            </button>
        </form>
        
        <div id="msg"></div>
        
        <button type="button" class="install-btn" onclick="installApp()">
            <i class="fa-solid fa-download"></i> Download GVCC App
        </button>
        
        <div class="credit-text"><i class="fa-solid fa-code-branch"></i> Manage by: GVCC Members</div>
    </div>
</div>

<script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    window.installApp = async function() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
        } else {
            alert("📲 Add to Home Screen via Browser Menu (⋮)");
        }
    };
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, increment, collection, addDoc, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-messaging.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBJX_dyLK80p2rNqSVvGY67TpWV7e_UdPI",
        authDomain: "gvcc-database.firebaseapp.com",
        projectId: "gvcc-database",
        storageBucket: "gvcc-database.firebasestorage.app",
        messagingSenderId: "1063216875940",
        appId: "1:1063216875940:web:a4ee2f39b01896b44c5931"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messaging = getMessaging(app);

    // 🌟 SECURE DATABASE: ONLY PAID VIP STUDENTS LIST 🌟
    const activeVIPs = ["805", "809", "806", "810", "820", "801", "803"];

    // 🌟 DIRECT CAMERA QR SCANNER LOGIC 🌟
    let html5Qrcode = null;
    const msgBox = document.getElementById("msg");

    window.startQRScanner = function() {
        document.getElementById("startScannerBtn").style.display = "none";
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("scanner-container").style.display = "block";
        msgBox.innerHTML = "📸 Opening Camera...";
        msgBox.style.color = "#38bdf8";

        // Using direct API to bypass file upload UI
        html5Qrcode = new Html5Qrcode("reader");
        html5Qrcode.start(
            { facingMode: "environment" }, // Forces back camera
            { fps: 10, qrbox: { width: 220, height: 220 } },
            (decodedText) => {
                // Success Scan!
                let scannedRoll = "";
                if (decodedText.includes("Roll: ")) {
                    scannedRoll = decodedText.split("Roll: ")[1].split("\n")[0].trim();
                }

                stopQRScanner(); // Stop camera instantly

                if(scannedRoll) {
                    if(activeVIPs.includes(scannedRoll)) {
                        autoLoginVIP(scannedRoll);
                    } else {
                        msgBox.style.color = "#ef4444"; 
                        msgBox.innerHTML = "🚨 <b>FAKE CARD DETECTED!</b><br><small style='color:#f87171;'>You haven't paid the VIP Fee. Pay at office to activate.</small>";
                    }
                } else {
                    msgBox.style.color = "#ef4444"; msgBox.innerHTML = "❌ Invalid QR Code!";
                }
            },
            (errorMessage) => { /* Background scan errors, ignore */ }
        ).then(() => {
            msgBox.innerHTML = ""; // Clear loading message when camera is ready
        }).catch((err) => {
            msgBox.style.color = "#ef4444"; 
            msgBox.innerHTML = "❌ Camera access denied or not found.";
            console.error(err);
        });
    };

    window.stopQRScanner = function() {
        if (html5Qrcode) { 
            html5Qrcode.stop().then(() => {
                html5Qrcode.clear(); 
                html5Qrcode = null; 
            }).catch(err => console.log(err));
        }
        document.getElementById("scanner-container").style.display = "none";
        document.getElementById("startScannerBtn").style.display = "flex";
        document.getElementById("loginForm").style.display = "block";
        msgBox.innerHTML = "";
    };

    // 🚀 VIP AUTO LOGIN MAGIC
    async function autoLoginVIP(roll) {
        msgBox.style.color = "#fbbf24"; msgBox.innerHTML = "🔄 Verifying VIP Card...";
        try {
            const docSnap = await getDoc(doc(db, "students", roll));
            if (docSnap.exists()) {
                let data = docSnap.data();
                msgBox.style.color = "#4ade80"; msgBox.innerHTML = "✅ VIP Access Granted!";
                localStorage.setItem("studentRoll", roll);
                localStorage.setItem("studentClass", data.class); 
                
                await saveLoginLog(roll, data["Name "] || data.Name || "VIP Student");
                
                setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
            } else {
                msgBox.style.color = "#ef4444"; msgBox.innerHTML = "❌ VIP Roll Number Not Found.";
            }
        } catch (error) { msgBox.style.color = "#ef4444"; msgBox.innerHTML = "⚠️ Network error."; }
    }


    const rollInput = document.getElementById("roll");
    const nameDiv = document.getElementById("dynamicName");

    rollInput.addEventListener("input", async function() {
        let roll = this.value.trim();
        if (roll.length >= 3) { 
            try {
                const docSnap = await getDoc(doc(db, "students", roll));
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    nameDiv.innerText = `👤 ${data["Name "] || data.Name || "Unknown Student"}`;
                    nameDiv.classList.add("show");
                } else { nameDiv.classList.remove("show"); }
            } catch (error) {}
        } else { nameDiv.classList.remove("show"); }
    });

    // 🚀 SMART LOGGING
    async function saveLoginLog(rollNumber, studentName) {
        try {
            const now = new Date();
            const logRef = doc(db, "login_logs", rollNumber);
            await setDoc(logRef, {
                roll: rollNumber, name: studentName,
                totalLoginCount: increment(1), 
                lastLoginAt: now.toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }),
                history: arrayUnion({ loginTime: now.toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }), timestamp: now.getTime() })
            }, { merge: true });
        } catch (error) {}
    }

    // 🔒 MANUAL LOGIN SYSTEM (For Non-VIPs)
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault(); 
        const loginBtn = document.getElementById("loginBtn"), btnText = document.getElementById("btnText");
        let roll = rollInput.value.trim(), password = document.getElementById("password").value.trim();

        loginBtn.disabled = true; btnText.innerText = "Checking...";
        msgBox.style.color = "#fbbf24"; msgBox.innerHTML = "🔄 Verifying...";

        try {
            const docSnap = await getDoc(doc(db, "students", roll));
            if (docSnap.exists()) {
                let data = docSnap.data();
                if (String(data["Password "] || data.Password || data["password "]).trim() === String(password).trim()) {
                    msgBox.style.color = "#4ade80"; msgBox.innerHTML = "✅ Login Successful!";
                    localStorage.setItem("studentRoll", roll);
                    localStorage.setItem("studentClass", data.class); 
                    await saveLoginLog(roll, data["Name "] || data.Name || "Unknown Student");
                    setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
                } else { msgBox.style.color = "#f87171"; msgBox.innerHTML = "❌ Wrong Password"; resetButton(); }
            } else { msgBox.style.color = "#f87171"; msgBox.innerHTML = "❌ Roll Number Not Found"; resetButton(); }
        } catch (error) { msgBox.style.color = "#f87171"; msgBox.innerHTML = "⚠️ Network error."; resetButton(); }

        function resetButton() { loginBtn.disabled = false; btnText.innerHTML = "Secure Login <i class='fa-solid fa-arrow-right-to-bracket'></i>"; }
    });
</script>

</body>
</html>
