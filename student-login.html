<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gyan Varsha Coaching Center - Student Login</title>
<link rel="icon" type="image/png" href="20260620_144347.png">
<meta name="description" content="ज्ञान वर्षा कोचिंग सेंटर (GVCC) का स्मार्ट स्टूडेंट पोर्टल। अपने रोल नंबर और पासवर्ड से सुरक्षित लॉगिन करें और अपना डैशबोर्ड देखें।">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
<!-- 🔥 CORE QR CODE LIBRARY (DIRECT CAMERA) 🔥 -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<!-- GLOBAL THEME SYSTEM -->
<link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>

<style>
* { -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: auto !important; -moz-user-select: auto !important; -ms-user-select: auto !important; user-select: auto !important; }
img { -webkit-user-drag: none; }

/* 🔥 VIP THEME VARIABLES 🔥 */
:root {
    --page-bg: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    --text-main: #1e293b;
    --card-bg: rgba(255, 255, 255, 0.6);
    --card-border: rgba(0, 0, 0, 0.1);
    --input-bg: rgba(255, 255, 255, 0.8);
    --input-text: #1e293b;
    --input-border: rgba(0, 0, 0, 0.15);
    --placeholder-color: #64748b;
    --divider-color: rgba(0, 0, 0, 0.1);
    --btn-login-bg: #ffffff;
    --btn-login-text: #0f172a;
    --btn-disabled-bg: rgba(0, 0, 0, 0.05);
    --btn-disabled-text: #94a3b8;
    --glow-color: rgba(56, 189, 248, 0.4);
    --credit-color: #475569;
}

[data-theme="dark"] {
    --page-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --text-main: white;
    --card-bg: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.1);
    --input-bg: rgba(255, 255, 255, 0.05);
    --input-text: white;
    --input-border: rgba(255, 255, 255, 0.1);
    --placeholder-color: #94a3b8;
    --divider-color: rgba(255, 255, 255, 0.1);
    --btn-login-bg: #ffffff;
    --btn-login-text: #0f172a;
    --btn-disabled-bg: rgba(255, 255, 255, 0.2);
    --btn-disabled-text: #94a3b8;
    --glow-color: rgba(255, 255, 255, 0.4);
    --credit-color: #64748b;
}

body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: var(--page-bg); 
    margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
    color: var(--text-main); overflow: hidden; overscroll-behavior-y: none; touch-action: manipulation; 
    transition: background 0.4s ease, color 0.4s ease; box-sizing: border-box;
}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

.login-container { position: relative; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.logo-glow-wrapper { position: relative; width: 100%; height: 130px; display: flex; justify-content: center; align-items: center; margin-bottom: -70px; z-index: 10; }
.logo-glow-wrapper::before { content: ''; position: absolute; width: 140px; height: 140px; margin-top: 15px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, var(--glow-color) 0deg 3deg, transparent 3deg 10deg); -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 70%); mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 70%); animation: rotateRays 25s linear infinite; z-index: -1; transition: background 0.4s; }
.logo-glow-wrapper::after { content: ''; position: absolute; width: 90px; height: 90px; margin-top: 15px; border-radius: 50%; background: var(--glow-color); filter: blur(20px); z-index: -1; transition: background 0.4s; }
@keyframes rotateRays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.login-logo { width: 170px; height: auto; filter: drop-shadow(0px 8px 15px rgba(0, 0, 0, 0.5)); position: relative; z-index: 5; pointer-events: none; }

.login-card { background: var(--card-bg); backdrop-filter: blur(15px); padding: 80px 20px 20px 20px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border); width: 100%; text-align: center; box-sizing: border-box; position: relative; transition: background 0.4s, border 0.4s; }
.title { color: #38bdf8; font-size: 24px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 1px; }


/* 🔥 1. VIP SCAN BUTTON - HERO EFFECT 🔥 */
.btn-scan { 
    background: linear-gradient(135deg, #10b981, #059669) !important; 
    color: white !important; width: 100%; border: 2px solid #34d399; 
    padding: 16px; border-radius: 16px; font-size: 17px; font-weight: 900; 
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer; 
    display: flex; justify-content: center; align-items: center; gap: 10px; 
    position: relative; overflow: hidden;
    animation: vipPulse 2s infinite; 
    transition: transform 0.2s;
}
/* Glowing Pulse Effect */
@keyframes vipPulse {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
    70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
/* Shining Sweep Effect */
.btn-scan::after {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(45deg); animation: shine 3s infinite; pointer-events: none;
}
@keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }


/* QR SCANNER CONTAINER */
#scanner-container { width: 100%; border-radius: 12px; overflow: hidden; display: none; border: 2px solid #10b981; margin-top: 10px; margin-bottom: 5px; background: #000; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
#reader { width: 100%; }
.stop-scan-btn { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; letter-spacing: 1px; font-size: 14px;}

.divider { display: flex; align-items: center; text-align: center; color: var(--placeholder-color); font-size: 11px; font-weight: 700; margin: 20px 0; }
.divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--divider-color); }
.divider:not(:empty)::before { margin-right: .5em; }
.divider:not(:empty)::after { margin-left: .5em; }

/* 🔥 2. LOGIN FORM & BUTTON - STANDARD SOLID 🔥 */
input { display: block; width: 100%; padding: 14px; margin: 12px auto; border: 1px solid var(--input-border); border-radius: 10px; font-size: 15px; box-sizing: border-box; transition: all 0.3s ease; background: var(--input-bg); color: var(--input-text); }
input::placeholder { color: var(--placeholder-color); }
input:focus { border-color: #38bdf8; background: var(--card-bg); box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); outline: none; }

.btn-login { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--btn-login-bg); color: var(--btn-login-text); padding: 14px; margin: 15px auto 5px auto; width: 100%; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
.btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); }
.btn-login:disabled { background: var(--btn-disabled-bg); color: var(--btn-disabled-text); cursor: not-allowed; box-shadow: none; }


/* 🔥 3. INSTALL APP BUTTON - CAPSULE / PILL SHAPE 🔥 */
.install-btn { 
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
    width: auto !important; /* Removes the boring full width */
    padding: 10px 25px !important; 
    background: linear-gradient(135deg, #0ea5e9, #2563eb) !important; 
    color: white !important; border: none !important; 
    border-radius: 50px !important; /* Makes it a beautiful Pill shape */
    font-size: 14px !important; font-weight: bold; cursor: pointer; 
    transition: all 0.3s ease; 
    margin: 15px auto 5px auto !important; 
    box-shadow: 0 6px 15px rgba(14, 165, 233, 0.3) !important; 
}
.install-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(14, 165, 233, 0.5) !important; }

/* THE MAGIC TAP FEEL */
.install-btn:active, .btn-login:active:not(:disabled), .btn-scan:active, .stop-scan-btn:active { 
    transform: scale(0.92) !important; 
    opacity: 0.8; 
    transition: all 0.1s ease; 
}
.install-btn i { animation: bounce 2s infinite; font-size: 16px; }

.credit-text { font-size: 11px; color: var(--credit-color); margin-top: 15px; font-weight: 500; letter-spacing: 0.5px; transition: color 0.4s; }
.spinner { width: 16px; height: 16px; border: 3px solid rgba(15, 23, 42, 0.3); border-top-color: #0f172a; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-4px);} 60% {transform: translateY(-2px);} }

#dynamicName { font-size: 13px; color: #4ade80; margin: -5px auto 5px auto; font-weight: 600; width: 100%; text-align: left; height: 16px; opacity: 0; transform: translateY(-5px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); padding-left: 5px; }
#dynamicName.show { opacity: 1; transform: translateY(0); }
#msg { font-weight: 600; font-size: 13px; margin-top: 10px; transition: all 0.3s ease; text-shadow: 0 1px 2px rgba(0,0,0,0.1); min-height: 18px; }
</style>
</head>
<body>

<div class="login-container">
    <div class="logo-glow-wrapper"><img src="20260620_144347.png" alt="GVCC Logo" class="login-logo"></div>
    <div class="login-card">
        <div class="title"><i class="fa-solid fa-user-graduate"></i> Student Portal</div>

        <!-- 🔥 VIP BUTTON 🔥 -->
        <button type="button" class="btn-scan" id="startScannerBtn" onclick="startQRScanner()">
            <i class="fa-solid fa-expand"></i> Scan VIP Card
        </button>

        <div id="scanner-container">
            <div id="reader"></div>
            <button type="button" class="stop-scan-btn" onclick="stopQRScanner()"><i class="fa-solid fa-xmark"></i> Cancel Camera</button>
        </div>

        <div class="divider">OR TYPE MANUAL</div>

        <form id="loginForm">
            <input type="number" id="roll" placeholder="Roll Number" required>
            <div id="dynamicName"></div>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn-login" id="loginBtn">
                <span class="spinner" id="btnSpinner"></span><span id="btnText">Login</span>
            </button>
        </form>
        
        <div id="msg"></div>
        
        <!-- 🌟 INSTALL BUTTON (Pill Shape) 🌟 -->
        <button type="button" class="install-btn" onclick="installApp()">
            <i class="fa-solid fa-cloud-arrow-down"></i> Install GVCC App
        </button>
        
        <div class="credit-text"><i class="fa-solid fa-code-branch"></i> Manage by: GVCC All Members</div>
    </div>
</div>

<script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    window.installApp = async function() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') console.log('App Installed!');
            deferredPrompt = null;
        } else {
            alert("📲 App Install Kaise Karein:\n\n1. Apne browser ke upar ya niche 3 dots (⋮) par click karein.\n2. 'Add to Home Screen' ya 'Install App' par click karein.\n3. Bas! Ab app aapke phone me install ho jayegi aur aap login kar payenge.");
        }
    };
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, increment, collection, addDoc, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-messaging.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBJX_dyLK80p2rNqSVvGY67TpWV7e_UdPI",
        authDomain: "gvcc-database.firebaseapp.com",
        projectId: "gvcc-database",
        storageBucket: "gvcc-database.firebasestorage.app",
        messagingSenderId: "1063216875940",
        appId: "1:1063216875940:web:a4ee2f39b01896b44c5931"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messaging = getMessaging(app);

    // 🌟 SECURE DATABASE: ONLY PAID VIP STUDENTS LIST 🌟
    const activeVIPs = ["805", "809", "806", "810", "820", "801", "803"];

    // 🌟 DIRECT CAMERA QR SCANNER LOGIC 🌟
    let html5Qrcode = null;
    const msgBox = document.getElementById("msg");

    window.startQRScanner = function() {
        document.getElementById("startScannerBtn").style.display = "none";
        document.getElementById("loginForm").style.display = "none";
        document.querySelector(".install-btn").style.display = "none";
        document.getElementById("scanner-container").style.display = "block";
        msgBox.innerHTML = "📸 Opening Camera...";
        msgBox.style.color = "#38bdf8";

        html5Qrcode = new Html5Qrcode("reader");
        html5Qrcode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 220, height: 220 } },
            (decodedText) => {
                let scannedRoll = "";
                if (decodedText.includes("Roll: ")) {
                    scannedRoll = decodedText.split("Roll: ")[1].split("\n")[0].trim();
                }

                stopQRScanner(); 

                if(scannedRoll) {
                    if(activeVIPs.includes(scannedRoll)) {
                        autoLoginVIP(scannedRoll);
                    } else {
                        msgBox.style.color = "#ef4444"; 
                        msgBox.innerHTML = "🚨 <b>FAKE CARD DETECTED!</b><br><small style='color:#f87171;'>You haven't paid the ₹50 VIP Fee. Pay at office to activate scanner. Until then, use manual login.</small>";
                    }
                } else {
                    msgBox.style.color = "#ef4444"; msgBox.innerHTML = "❌ Invalid QR Code!";
                }
            },
            (errorMessage) => { /* ignore */ }
        ).then(() => {
            msgBox.innerHTML = ""; 
        }).catch((err) => {
            msgBox.style.color = "#ef4444"; 
            msgBox.innerHTML = "❌ Camera access denied.";
        });
    };

    window.stopQRScanner = function() {
        if (html5Qrcode) { 
            html5Qrcode.stop().then(() => { html5Qrcode.clear(); html5Qrcode = null; }).catch(err => console.log(err));
        }
        document.getElementById("scanner-container").style.display = "none";
        document.getElementById("startScannerBtn").style.display = "flex";
        document.getElementById("loginForm").style.display = "block";
        document.querySelector(".install-btn").style.display = "inline-flex"; // Restore Pill shape
        msgBox.innerHTML = "";
    };

    // 🚀 VIP AUTO LOGIN MAGIC
    async function autoLoginVIP(roll) {
        msgBox.style.color = "#fbbf24"; msgBox.innerHTML = "🔄 Verifying VIP Card...";
        try {
            const docSnap = await getDoc(doc(db, "students", roll));
            if (docSnap.exists()) {
                let data = docSnap.data();
                msgBox.style.color = "#4ade80"; msgBox.innerHTML = "✅ VIP Login Successful!";
                localStorage.setItem("studentRoll", roll);
                localStorage.setItem("studentClass", data.class); 
                
                await saveLoginLog(roll, data["Name "] || data.Name || "VIP Student");
                
                msgBox.innerHTML = "🚀 Redirecting...";
                setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
            } else {
                msgBox.style.color = "#ef4444"; msgBox.innerHTML = "❌ VIP Roll Number Not Found in DB.";
            }
        } catch (error) { msgBox.style.color = "#ef4444"; msgBox.innerHTML = "⚠️ Network error."; }
    }

    // 🌟 SMART NOTIFICATION SYSTEM 🌟
    const VAPID_KEY = "BCm8eNsThwmymZsqhfaDcHw37fLgNI2qWnr8aLUc0xWSCl0BuhRSkZ0KrYI1D8n0wzK8MY5fybOgMVWoXAR97VM";

    setTimeout(async () => {
        if ("Notification" in window && Notification.permission === "default") {
            try {
                const permission = await Notification.requestPermission();
                if (permission === "granted") {
                    const token = await getToken(messaging, { vapidKey: VAPID_KEY });
                    if (token) {
                        await addDoc(collection(db, "notification_tokens"), { token: token, userType: "Student", timestamp: serverTimestamp() });
                    }
                }
            } catch (error) {}
        }
    }, 2000);

    window.addEventListener('appinstalled', async () => {
        try {
            const statsRef = doc(db, "admin_stats", "app_downloads");
            await setDoc(statsRef, { total_downloads: increment(1), last_installed_at: new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }) }, { merge: true });
        } catch (e) {}
    });

    const rollInput = document.getElementById("roll");
    const nameDiv = document.getElementById("dynamicName");

    rollInput.addEventListener("input", async function() {
        let roll = this.value.trim();
        if (roll.length >= 3) { 
            try {
                const docSnap = await getDoc(doc(db, "students", roll));
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    nameDiv.innerText = `👤 ${data["Name "] || data.Name || "Unknown Student"}`;
                    nameDiv.classList.add("show");
                } else { nameDiv.classList.remove("show"); }
            } catch (error) {}
        } else { nameDiv.classList.remove("show"); }
    });

    // 🚀 SMART LOGGING
    async function saveLoginLog(rollNumber, studentName) {
        try {
            const now = new Date();
            const logRef = doc(db, "login_logs", rollNumber);
            await setDoc(logRef, {
                roll: rollNumber,
                name: studentName,
                totalLoginCount: increment(1), 
                lastLoginAt: now.toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }),
                history: arrayUnion({
                    loginTime: now.toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }),
                    timestamp: now.getTime()
                })
            }, { merge: true });
        } catch (error) {}
    }

    // 🔒 MANUAL LOGIN SYSTEM
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault(); 
        const loginBtn = document.getElementById("loginBtn"), btnSpinner = document.getElementById("btnSpinner"), btnText = document.getElementById("btnText");
        let roll = rollInput.value.trim(), password = document.getElementById("password").value.trim();

        loginBtn.disabled = true; btnSpinner.style.display = "block"; btnText.innerText = "Checking...";
        msgBox.style.color = "#fbbf24"; msgBox.innerHTML = "🔄 Verifying...";

        try {
            const docSnap = await getDoc(doc(db, "students", roll));
            if (docSnap.exists()) {
                let data = docSnap.data();
                if (String(data["Password "] || data.Password || data["password "]).trim() === String(password).trim()) {
                    
                    if ("Notification" in window && Notification.permission === "granted") {
                        try {
                            const token = await getToken(messaging, { vapidKey: VAPID_KEY });
                            if (token) {
                                await setDoc(doc(db, "students", roll), { notificationToken: token, class: data.class }, { merge: true });
                            }
                        } catch (err) {}
                    }

                    msgBox.style.color = "#4ade80"; msgBox.innerHTML = "✅ Login Successful!";
                    localStorage.setItem("studentRoll", roll);
                    localStorage.setItem("studentClass", data.class); 
                    
                    await saveLoginLog(roll, data["Name "] || data.Name || "Unknown Student");
                    
                    msgBox.innerHTML = "🚀 Redirecting...";
                    setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
                } else { msgBox.style.color = "#f87171"; msgBox.innerHTML = "❌ Wrong Password"; resetButton(); }
            } else { msgBox.style.color = "#f87171"; msgBox.innerHTML = "❌ Roll Number Not Found"; resetButton(); }
        } catch (error) { msgBox.style.color = "#f87171"; msgBox.innerHTML = "⚠️ Network error."; resetButton(); }

        function resetButton() { loginBtn.disabled = false; btnSpinner.style.display = "none"; btnText.innerText = "Login"; }
    });
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/service-worker.js", { scope: "/" }).catch(function(error) {});
  });
}
</script>
</body>
</html>
