<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GVCC song test</title>
<style>
  body { margin: 0; padding: 14px; font-family: system-ui, sans-serif; background: #fff; color: #111; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  button { font-size: 20px; padding: 16px 20px; width: 100%; border: 0; border-radius: 12px; background: #0b6bcb; color: #fff; }
  button:disabled { background: #888; }
  #sum { margin: 14px 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  #sum b { color: #0b6bcb; }
  pre { font-size: 11px; line-height: 1.35; background: #f3f3f3; padding: 8px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>GVCC song test</h1>
<button id="go">Test shuru karo (1 minute)</button>
<div id="sum">Button dabao, screen on rakho aur 1 minute ruko. Beep aur song ki awaaz aayegi.</div>
<pre id="log"></pre>

<script>
(function () {
  var sum = document.getElementById("sum");
  var logEl = document.getElementById("log");
  var lines = [];
  var T0 = performance.now();
  function say(msg) { lines.push(msg); sum.innerHTML = lines.join("\n"); }
  function log(msg) {
    logEl.textContent += ((performance.now() - T0) / 1000).toFixed(1) + "s " + msg + "\n";
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function bust(url) { return url + "?t=" + Date.now() + Math.floor(Math.random() * 1000); }

  var c = navigator.connection || {};
  var ua = navigator.userAgent.replace(/Mozilla\/5.0 /, "").slice(0, 110);
  log("UA " + ua);
  log("net " + (c.effectiveType || "?") + " downlink=" + (c.downlink || "?") + "Mbps rtt=" + (c.rtt || "?") + "ms saveData=" + (c.saveData || false));

  // One audio element is reused for every test (some phones unlock sound per element).
  var A = new Audio();
  A.preload = "auto";
  A.volume = 0.3;
  var evNames = ["loadstart", "loadedmetadata", "canplay", "playing", "waiting", "stalled", "suspend", "pause", "ended", "error", "abort", "emptied"];
  var counts = {};
  var playedOnce = false;
  evNames.forEach(function (n) {
    A.addEventListener(n, function () {
      if (n === "playing") { playedOnce = true; }
      if (n !== "waiting" || playedOnce) { counts[n] = (counts[n] || 0) + 1; }   // the first "waiting" is only the start
      var r = A.buffered, b = r.length ? r.end(r.length - 1).toFixed(0) : 0;
      log("  ev " + n + " t=" + A.currentTime.toFixed(1) + " rs=" + A.readyState + " buf=" + b + (A.error ? " ERR" + A.error.code : ""));
    });
  });
  function reset() { counts = {}; playedOnce = false; }
  function unload() { try { A.pause(); A.removeAttribute("src"); A.load(); } catch (e) { } }

  async function netTest() {
    try {
      var t = performance.now();
      var res = await fetch(bust("songs/rahna.lite.mp3"), { cache: "no-store" });
      var buf = await res.arrayBuffer();
      var s = (performance.now() - t) / 1000;
      var kbps = Math.round(buf.byteLength * 8 / 1000 / s);
      say("<b>Net:</b> " + Math.round(buf.byteLength / 1024) + " KB " + s.toFixed(1) + " sec mein = " + kbps + " kbps (gaana 40 kbps mangta hai)");
      log("net full GET status " + res.status + " bytes " + buf.byteLength + " in " + s.toFixed(2) + "s");
    } catch (e) { say("<b>Net:</b> download fail: " + e); }
    try {
      var r2 = await fetch(bust("songs/awara.lite.mp3"), { headers: { Range: "bytes=500000-520000" }, cache: "no-store" });
      var b2 = await r2.arrayBuffer();
      say("<b>Range:</b> status " + r2.status + " (206 theek hai), " + b2.byteLength + " bytes mile");
      log("range status " + r2.status + " content-range " + r2.headers.get("content-range") + " type " + r2.headers.get("content-type"));
    } catch (e) { say("<b>Range:</b> fail: " + e); }
  }

  async function playTest(label, url, seconds) {
    reset();
    A.src = bust(url);
    A.currentTime = 0;
    var started = performance.now();
    var ok = true, err = "";
    try { await A.play(); } catch (e) { ok = false; err = e.name; }
    if (!ok) { say("<b>" + label + ":</b> play() roka gaya: " + err); return; }
    var heard = 0, prev = 0, maxGap = 0, gap = 0;
    for (var i = 0; i < seconds * 2; i++) {
      await wait(500);
      var t = A.currentTime;
      if (t - prev > 0.25) { heard += 0.5; gap = 0; } else { gap += 0.5; if (gap > maxGap) { maxGap = gap; } }
      prev = t;
    }
    var w = counts.waiting || 0, e = counts.error || 0, p = counts.pause || 0;
    say("<b>" + label + ":</b> " + seconds + " sec mein " + heard.toFixed(0) + " sec chala, ruka " + w + " baar, sabse lamba gap " + maxGap.toFixed(0) + " sec, pause " + p + ", error " + e + (A.error ? " (code " + A.error.code + ")" : ""));
    unload();
  }

  async function pausedBufferTest() {
    reset();
    A.src = bust("songs/awara.lite.mp3");
    A.currentTime = 0;
    try { await A.play(); } catch (e) { say("<b>Pause-buffer:</b> play() roka gaya: " + e.name); return; }
    await wait(1500);
    A.pause();
    var r = A.buffered;
    var before = r.length ? r.end(r.length - 1) : 0;
    await wait(12000);
    r = A.buffered;
    var after = r.length ? r.end(r.length - 1) : 0;
    var resumed = true, rerr = "";
    var t1 = A.currentTime;
    try { await A.play(); } catch (e) { resumed = false; rerr = e.name; }
    await wait(3000);
    var moved = A.currentTime - t1;
    say("<b>Pause mein buffer:</b> pause ke samay " + before.toFixed(0) + " sec, 12 sec baad " + after.toFixed(0) + " sec (badhna chahiye). Dobara play: " + (resumed ? (moved > 2 ? "chala" : "nahi chala") : "roka gaya " + rerr));
    unload();
  }

  async function beepTest() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      gain.gain.value = 0.15; osc.frequency.value = 440;
      osc.connect(gain); gain.connect(ctx.destination); osc.start();
      await wait(3000);
      osc.stop(); ctx.close();
      say("<b>Beep:</b> 3 sec ka beep chala (ye suna ya nahi? 3 sec poora aaya?)");
    } catch (e) { say("<b>Beep:</b> fail: " + e); }
  }

  var btn = document.getElementById("go");
  btn.addEventListener("click", async function () {
    btn.disabled = true; btn.textContent = "Test chal raha hai... ruko";
    lines = []; logEl.textContent = ""; T0 = performance.now();
    log("UA " + ua);
    log("net " + (c.effectiveType || "?") + " downlink=" + (c.downlink || "?") + "Mbps rtt=" + (c.rtt || "?") + "ms saveData=" + (c.saveData || false));
    say("<b>Phone:</b> " + ua);
    say("<b>Connection:</b> " + (c.effectiveType || "?") + ", " + (c.downlink || "?") + " Mbps");
    // Start the sound inside the tap, so the browser lets the later tests play too.
    try { A.src = bust("songs/rahna.lite.mp3"); await A.play(); A.pause(); } catch (e) { log("first play blocked " + e.name); }
    await netTest();
    await playTest("Test 1 chhota song", "songs/rahna.lite.mp3", 12);
    await playTest("Test 2 bada song", "songs/awara.lite.mp3", 20);
    await pausedBufferTest();
    await beepTest();
    say("\n<b>TEST POORA.</b> Ab is poori screen ka screenshot lo (neeche scroll karke log ka bhi).");
    btn.textContent = "Test poora";
  });
})();
</script>
</body>
</html>
