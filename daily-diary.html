<script>
/* -----------------------------
   Helper utilities (security)
   ----------------------------- */
function escapeHTML(str) {
    if (str === undefined || str === null) return '';
    return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
}

// Converts *bold* style to <b> after escaping everything else
function formatBoldMarkdown(plainText) {
    const escaped = escapeHTML(plainText);
    // Replace only pairs of *...* (non-greedy) with <b>...</b>
    return escaped.replace(/\*(.+?)\*/g, '<b>$1</b>');
}

// Safely create text node wrapper (no HTML parsing)
function setText(el, text) {
    el.textContent = text ?? '';
}

// Safe URL validation for video links (basic)
function sanitizeUrl(url) {
    try {
        const u = new URL(url);
        if (u.protocol === 'http:' || u.protocol === 'https:') return u.toString();
        return null;
    } catch (e) {
        return null;
    }
}

const teacherPhones = {

function getStudentContext() {
    const sName = localStorage.getItem("studentName") || "Student";
    const sClass = localStorage.getItem("studentClass") || "All";
    const nameLower = sName.toLowerCase();
    let actionWord = "कर रहा हूँ";
    const girlKeywords = ["kumari","khatoon","parveen","bano","begum","saba","fatima","anjali","priya","neha","sana","muskan","rani","gajala","shabnam"];
    if (girlKeywords.some(k => nameLower.includes(k))) actionWord = "कर रही हूँ";
    const hour = new Date().getHours();
    let greeting = "Good Morning";
    if (hour >= 12 && hour < 17) greeting = "Good Afternoon";
    else if (hour >= 17) greeting = "Good Evening";
    return { sName, sClass, actionWord, greeting };
}

/* Open WhatsApp with a safe message */
function openWhatsApp(phone, msg) {
    const encoded = encodeURIComponent(msg);
    window.open(`https://wa.me/${phone}?text=${encoded}`, '_blank', 'noopener');
}

window.askForMissingHW = function(teacherName) {
    const { sName, sClass, actionWord, greeting } = getStudentContext();

window.askForNotes = function(teacherName, encodedTopic, encodedShortHW) {

};

/* -----------------------------
   Modal handling (safe DOM)
   ----------------------------- */
const modal = document.getElementById('hwModal');
const modalSubtitle = document.getElementById('modalSubtitle');
const modalHWText = document.getElementById('modalHWText');
const closeModalBtn = document.getElementById('closeModalBtn');
const modalCloseFooter = document.getElementById('modalCloseFooter');

function openHomeworkModal(encodedHW, teacherName, subject, encodedTopic, encodedShortHW, encodedImageUrls) {
    // decode safely
    const fullHW = decodeURIComponent(encodedHW || '');
    const topic = decodeURIComponent(encodedTopic || '');
    const shortHW = decodeURIComponent(encodedShortHW || '');
    let imageUrls = [];
    if (encodedImageUrls && encodedImageUrls !== 'undefined') {
        try {
            const parsed = JSON.parse(decodeURIComponent(encodedImageUrls));
            if (Array.isArray(parsed)) imageUrls = parsed.filter(u => typeof u === 'string' && u.startsWith('http'));
        } catch (e) {
            imageUrls = [];
        }
    }

    modalSubtitle.innerHTML = `<strong style="color:#1e293b">Subject:</strong> ${escapeHTML(subject || '')} &nbsp;|&nbsp; <strong style="color:#1e293b">Teacher:</strong> ${escapeHTML(teacherName || '')}`;

    // Construct content safely
    modalHWText.innerHTML = ''; // clear
    if ((!fullHW || fullHW === 'undefined' || fullHW.trim() === '') && imageUrls.length === 0) {
        const wrapper = document.createElement('div');
        wrapper.style.textAlign = 'center';
        wrapper.style.padding = '8px 0';
        wrapper.innerHTML = `
            <i class="fa-solid fa-face-grin-beam-sweat fa-bounce" style="font-size:44px;color:#f59e0b;margin-bottom:12px;"></i>
            <p style="color:#64748b;font-size:14px;margin-bottom:14px;">सर ने लम्बा वाला प्रश्न यहाँ नहीं डाला है।</p>
        `;
        const infoBox = document.createElement('div');
        infoBox.style.background = '#f8fafc';
        infoBox.style.border = '1px solid #e2e8f0';
        infoBox.style.borderRadius = '8px';
        infoBox.style.padding = '12px';
        infoBox.style.textAlign = 'left';
        infoBox.innerHTML = `<strong style="color:#0ea5e9">📝 Topic:</strong> ${escapeHTML(topic)}<br><strong style="color:#ef4444">🏠 HW:</strong> ${escapeHTML(shortHW)}`;
        wrapper.appendChild(infoBox);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'wa-btn';
        btn.style.marginTop = '12px';
        btn.innerHTML = `<i class="fa-brands fa-whatsapp" style="color:#25D366"></i> व्हाट्सएप पर नोट्स / फोटो मांगें`;
        btn.addEventListener('click', () => window.askForNotes(teacherName, encodeURIComponent(topic), encodeURIComponent(shortHW)));

        wrapper.appendChild(btn);
        modalHWText.appendChild(wrapper);
    } else {
        // show text if present
        if (fullHW && fullHW !== 'undefined' && fullHW.trim() !== '') {
            const div = document.createElement('div');
            div.style.fontSize = '15px';
            div.style.color = '#1e293b';
            div.style.lineHeight = '1.7';
            div.style.whiteSpace = 'pre-wrap';
            // allow only *bold* markup
            div.innerHTML = formatBoldMarkdown(fullHW);
            modalHWText.appendChild(div);
        }

        // show images if present
        if (imageUrls.length > 0) {
            const imagesContainer = document.createElement('div');
            imagesContainer.style.marginTop = '12px';
            imagesContainer.style.display = 'flex';
            imagesContainer.style.flexDirection = 'column';
            imagesContainer.style.gap = '12px';

            const hint = document.createElement('p');
            hint.style.fontSize = '12px';
            hint.style.color = '#ef4444';
            hint.style.margin = '0';
            hint.style.textAlign = 'center';
            hint.style.fontWeight = '700';
            hint.innerHTML = `<i class="fa-solid fa-hand-pointer"></i> (फोटो को टैप करके बड़ा करें)`;
            imagesContainer.appendChild(hint);

            imageUrls.forEach(src => {
                const img = document.createElement('img');
                img.className = 'hw-image';
                img.loading = 'lazy';
                img.alt = 'Homework Note';
                img.src = src;
                img.addEventListener('click', () => window.open(src, '_blank', 'noopener'));
                imagesContainer.appendChild(img);
            });
            modalHWText.appendChild(imagesContainer);
        }

        // WhatsApp button to ask doubts
        const askBtn = document.createElement('button');
        askBtn.type = 'button';
        askBtn.className = 'wa-btn';
        askBtn.style.marginTop = '18px';
        askBtn.innerHTML = `<i class="fa-brands fa-whatsapp" style="color:#25D366"></i> व्हाट्सएप पर डाउट पूछें / नोट्स मांगे`;
        askBtn.addEventListener('click', () => window.askForNotes(teacherName, encodeURIComponent(topic), encodeURIComponent(shortHW)));
        modalHWText.appendChild(askBtn);
    }

    // show modal & focus
    modal.setAttribute('aria-hidden','false');
    modal.style.display = 'flex';
    modalHWText.focus();
}

function closeHomeworkModal() {
    modal.setAttribute('aria-hidden','true');
    modal.style.display = 'none';
}

closeModalBtn.addEventListener('click', closeHomeworkModal);
modalCloseFooter.addEventListener('click', closeHomeworkModal);
modal.addEventListener('click', (e) => {
    if (e.target === modal) closeHomeworkModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHomeworkModal(); });

/* -----------------------------
   Firestore: safe initialization and query
   ----------------------------- */
(async function initFirebaseAndListen(){
    try {
        // load firebase modular SDK dynamically (already used in original app)
        // Using dynamic import keeps top-level script valid if blocked
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js');
        const { getFirestore, collection, query, orderBy, onSnapshot, where, limit } = await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js');

        const firebaseConfig = {
            apiKey: "AIzaSyBJX_dyLK80p2rNqSVvGY67TpWV7e_UdPI",
            authDomain: "gvcc-database.firebaseapp.com",
            projectId: "gvcc-database",
            storageBucket: "gvcc-database.firebasestorage.app",
            messagingSenderId: "1063216875940",
            appId: "1:1063216875940:web:a4ee2f39b01896b44c5931"
        };

        // Prevent double-init in case of multiple imports
        try { initializeApp(firebaseConfig); } catch(e) { /* already initialized */ }

        const db = getFirestore();
        const studentClass = localStorage.getItem("studentClass") || "All";

        // Build safe query: when studentClass != "All" use where filter, always limit results
        let q;
        if (studentClass && studentClass !== 'All') {
            // Using 'in' keeps only docs targeted to student's class or All
            q = query(collection(db, "daily_diary"), where("targetClass", "in", [studentClass, "All"]), orderBy("timestamp","desc"), limit(100));
        } else {
            q = query(collection(db, "daily_diary"), orderBy("timestamp","desc"), limit(100));
        }

        const diaryList = document.getElementById('diaryList');
        const loadingState = document.getElementById('loadingState');

        onSnapshot(q, (snapshot) => {
            loadingState?.remove();
            diaryList.innerHTML = ''; // clear container

            const todayStr = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            const teachersPostedToday = new Set();
            const allTeachers = ["Md Nijamuddin Sir","Vikash Sir","Md Faiyaz Sir"];

            let anyShown = false;

            snapshot.forEach(doc => {
                const data = doc.data ? doc.data() : doc;
                // defensive checks
                if (!data) return;
                // targetClass match already applied in query, but keep defensive
                if (data.targetClass && studentClass !== 'All' && data.targetClass !== studentClass && data.targetClass !== 'All') return;

                anyShown = true;
                if (data.date === todayStr && data.teacherName) teachersPostedToday.add(data.teacherName);

                // prepare values safely
                const subject = data.subject || '';
                const date = data.date || '';
                const teacherName = data.teacherName || '';
                const classTopic = data.classTopic || '';
                const hwSummary = data.homeworkSummary || data.homework || 'कोई जानकारी नहीं';
                const fullHW = data.fullHomework || '';
                // image fields may be array or single url
                let imageUrls = [];
                if (Array.isArray(data.imageUrls)) imageUrls = data.imageUrls.filter(u => typeof u === 'string' && u.startsWith('http'));
                else if (typeof data.imageUrl === 'string' && data.imageUrl.startsWith('http')) imageUrls = [data.imageUrl];

                const safeImageUrlsEncoded = encodeURIComponent(JSON.stringify(imageUrls));
                const safeFullHW = encodeURIComponent(fullHW);
                const safeTopic = encodeURIComponent(classTopic);
                const safeShortHW = encodeURIComponent(hwSummary);

                // Build card via DOM (avoid innerHTML injection)
                const card = document.createElement('article');
                card.className = 'update-item';
                card.setAttribute('role','article');

                const meta = document.createElement('div');
                meta.className = 'meta';
                const subjSpan = document.createElement('span');
                subjSpan.style.fontWeight = '800';
                subjSpan.style.color = '#1e293b';
                subjSpan.style.fontSize = '14px';
                subjSpan.innerHTML = `<i class="fa-solid fa-book" style="color:#8b5cf6"></i> ${escapeHTML(subject)}`;
                const dateSpan = document.createElement('span');
                dateSpan.innerHTML = `<i class="fa-regular fa-calendar"></i> ${escapeHTML(date)}`;
                meta.appendChild(subjSpan);
                meta.appendChild(dateSpan);
                card.appendChild(meta);

                const teacherBadge = document.createElement('div');
                teacherBadge.className = 'teacher-badge';
                teacherBadge.textContent = `By: ${teacherName}`;
                card.appendChild(teacherBadge);

                const contentBox = document.createElement('div');
                contentBox.className = 'content-box';
                const topicDiv = document.createElement('div');
                topicDiv.style.marginBottom = '8px';
                topicDiv.innerHTML = `<strong style="color:#0ea5e9">📝 Topic:</strong> ${escapeHTML(classTopic)}`;
                const hwDiv = document.createElement('div');
                hwDiv.innerHTML = `<strong style="color:#ef4444">🏠 HW:</strong> <span style="color:#64748b">${escapeHTML(hwSummary)}</span>`;
                if (imageUrls.length > 0) hwDiv.innerHTML += ` <i class="fa-solid fa-image" style="color:#f59e0b;margin-left:8px"></i>`;

                contentBox.appendChild(topicDiv);
                contentBox.appendChild(hwDiv);
                card.appendChild(contentBox);

                // View button
                const viewBtn = document.createElement('button');
                viewBtn.type = 'button';
                viewBtn.className = 'btn-view-hw';
                viewBtn.innerHTML = `<span>View Full Homework</span> <i class="fa-solid fa-expand"></i>`;
                viewBtn.addEventListener('click', () => openHomeworkModal(safeFullHW, teacherName, subject, safeTopic, safeShortHW, safeImageUrlsEncoded));
                card.appendChild(viewBtn);

                // optional video link (sanitize URL)
                if (data.videoLink) {
                    const v = sanitizeUrl(data.videoLink);
                    if (v) {
                        const a = document.createElement('a');
                        a.href = v;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.className = 'video-link';
                        a.innerHTML = `<i class="fa-brands fa-youtube"></i> Basic Video देखें`;
                        card.appendChild(a);
                    }
                }

                diaryList.appendChild(card);
            });

            if (!anyShown) {
                const empty = document.createElement('div');
                empty.style.textAlign = 'center';
                empty.style.marginTop = '40px';
                empty.style.color = '#94a3b8';
                empty.style.fontSize = '18px';
                empty.style.fontWeight = '700';
                empty.textContent = 'आज का कोई अपडेट नहीं है!';
                diaryList.appendChild(empty);
            }

            // Missing teacher buttons
            const allTeachers = ["Md Nijamuddin Sir","Vikash Sir","Md Faiyaz Sir"];
            const missingTeachers = allTeachers.filter(t => !Array.from(teachersPostedToday || []).includes(t));
            if (missingTeachers.length > 0) {
                const box = document.createElement('div');
                box.className = 'missing-box';
                const p = document.createElement('p');
                p.style.color = '#475569';
                p.style.fontSize = '13px';
                p.style.fontWeight = '700';
                p.style.margin = '0 0 8px 0';
                p.textContent = 'क्या आज किसी सर ने होमवर्क नहीं डाला? उन्‍हें व्हाट्सएप करके पूछें:';
                box.appendChild(p);

                const wrap = document.createElement('div');
                wrap.style.display = 'flex';
                wrap.style.flexWrap = 'wrap';
                wrap.style.justifyContent = 'center';
                wrap.style.gap = '8px';

                missingTeachers.forEach(t => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'wa-btn-small';
                    btn.innerHTML = `<i class="fa-brands fa-whatsapp"></i> ${escapeHTML(t)}`;
                    btn.addEventListener('click', () => window.askForMissingHW(t));
                    wrap.appendChild(btn);
                });

                box.appendChild(wrap);
                diaryList.appendChild(box);
            }

        }, (err) => {
            // onSnapshot error
            const loading = document.getElementById('loadingState');
            if (loading) loading.innerHTML = `<p style="color:#ef4444">डेटा लोड करने में त्रुटि हुई। कृपया पेज रिफ्रेश करें।</p>`;
            console.error('Firestore snapshot error:', err);
        });

    } catch (err) {
        console.error('Firebase initialization failed:', err);
        const loading = document.getElementById('loadingState');
        if (loading) loading.innerHTML = `<p style="color:#ef4444">सर्विस उपलब्ध नहीं है। नेटवर्क चेक करें।</p>`;
    }
})();

/* -----------------------------
   Activity tracker (debounced & optimized)
   ----------------------------- */

        if (!activeRoll) return;
        let lastSent = 0;
        let entryTime = Date.now();

        const updateIntervalMs = 15000; // 15 seconds

        // lazy init firebase writes, dynamic import as needed
        let dbRefs = null;
        async function initDbRefs() {

            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js');
            const { getFirestore, doc, setDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js');
            try { initializeApp({
                apiKey: "AIzaSyBJX_dyLK80p2rNqSVvGY67TpWV7e_UdPI",
                authDomain: "gvcc-database.firebaseapp.com",
                projectId: "gvcc-database",
                storageBucket: "gvcc-database.firebasestorage.app",
                messagingSenderId: "1063216875940",
                appId: "1:1063216875940:web:a4ee2f39b01896b44c5931"
            }); } catch(e) {}
            const db = getFirestore();
            const studentDocRef = doc(db, 'activity_logs', activeRoll);
            const pageDocRef = doc(db, 'activity_logs', activeRoll, 'pages', pageName);
            dbRefs = { setDoc, serverTimestamp, studentDocRef, pageDocRef };
            return dbRefs;
        }

        async function sendUpdate(force=false) {
            try {
                const now = Date.now();
                timeSpentSeconds = Math.floor((now - entryTime)/1000);
                if (!force && (now - lastSent) < updateIntervalMs) return;
                lastSent = now;
                const refs = await initDbRefs();
                await refs.setDoc(refs.studentDocRef, { rollNumber: activeRoll, lastActiveAt: refs.serverTimestamp }, { merge: true });
                await refs.setDoc(refs.pageDocRef, {
                    pageVisited: pageName,
                    timeSpentSeconds,
                    timeSpentText: `${Math.floor(timeSpentSeconds/60)} Min ${timeSpentSeconds%60} Sec`,
                    lastUpdated: refs.serverTimestamp,
                    date: new Date().toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata' })
                }, { merge: true });
            } catch (e) {
                // fail silently to avoid spamming console in production
            }
        }

        // periodic updates
        const intervalId = setInterval(() => sendUpdate(false), updateIntervalMs);

        // send one final update on visibility change or unload
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') sendUpdate(true);
        });
        window.addEventListener('beforeunload', () => { sendUpdate(true); });

    } catch (e) {
        // ignore activity tracker errors
    }
})();
</script>
