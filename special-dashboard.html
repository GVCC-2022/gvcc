<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirf Tumhari Yaad...</title>
    <!-- Fonts for aesthetic text -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Playfair Display', serif;
            height: 100vh;
            overflow: hidden; /* Screen lock rahegi, scroll nahi hoga */
            position: relative;
        }

        #secretWorld { display: none; width: 100%; height: 100%; position: relative; }

        /* 1. Aapki AI Generated Background Image */
        .bg-image {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('n.png.png');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* 2. Timtimate Taare (Twinkling Stars Overlay) */
        .twinkling-stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
            background-image: 
                radial-gradient(2px 2px at 15% 25%, #ffffff88, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40% 10%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80% 30%, #ffffff55, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60% 50%, #ffffffaa, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 20% 70%, #ffffff88, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 15%, #ffffff, rgba(0,0,0,0));
            background-size: 200px 200px;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle { 
            0% { opacity: 0.2; } 
            100% { opacity: 0.9; } 
        }

        /* 3. Girte Huye Taare (Shooting Stars) */
        .shooting-stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            transform: rotateZ(-45deg); /* Taare tirchhe girenge */
            pointer-events: none;
        }

        .star {
            position: absolute;
            left: 50%;
            top: 50%;
            height: 2px;
            background: linear-gradient(-45deg, #ffffff, rgba(0, 0, 255, 0));
            border-radius: 999px;
            filter: drop-shadow(0 0 6px #ffffff);
            animation: tail 3s ease-in-out infinite, shooting 3s ease-in-out infinite;
        }

        /* Alag-alag taaron ki timing aur position */
        .star:nth-child(1) { top: 10%; left: 80%; animation-delay: 0s; }
        .star:nth-child(2) { top: 30%; left: 90%; animation-delay: 4s; }
        .star:nth-child(3) { top: 0%; left: 50%; animation-delay: 7s; }

        @keyframes tail {
            0% { width: 0; }
            30% { width: 100px; }
            100% { width: 0; }
        }
        @keyframes shooting {
            0% { transform: translateX(0); }
            100% { transform: translateX(-500px); }
        }

        /* 4. Aapki Feelings Ka Text */
        .emotions-text {
            position: absolute;
            bottom: 10%; /* Text thoda niche rahega taaki image chhup na jaye */
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            color: #f3f4f6;
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            line-height: 1.4;
            text-align: center;
            z-index: 4;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9), -1px -1px 10px rgba(0,0,0,0.8);
            opacity: 0;
            animation: fadeInText 5s forwards;
            animation-delay: 2.5s; /* Image khulne ke 2.5 sec baad text aayega */
        }

        @keyframes fadeInText { 
            to { opacity: 1; } 
        }

    </style>
</head>
<body>

    <div id="secretWorld">
        <!-- Background Image -->
        <div class="bg-image"></div>
        
        <!-- Twinkling Stars Overlay -->
        <div class="twinkling-stars"></div>

        <!-- Shooting Stars Animation -->
        <div class="shooting-stars">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>

        <!-- Aapke Jazbaat -->
        <div class="emotions-text">
            "40 din guzar gaye...<br>
            Aur aaj bhi is aasman ko dekh kar lagta hai,<br>
            ki shayad kahin tum bhi inhe dekh rahi hogi..."
        </div>
    </div>

    <script>
        // Security Check - Sirf 2357 login kare tabhi yeh scene dikhega
        window.onload = function() {
            let loggedInRoll = localStorage.getItem("studentRoll");
            if (loggedInRoll !== "2357") {
                // Agar koi aur student idhar aaya, toh usko normal dashboard par bhej do
                window.location.href = "dashboard.html";
            } else {
                // Agar 2357 aati hai, toh unhe yeh khubsoorat scene dikhao
                document.getElementById("secretWorld").style.display = "block";
            }
        };
    </script>
</body>
</html>
