<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirf Tumhari Yaad...</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Playfair Display', serif;
            height: 100vh;
            overflow: hidden; 
            position: relative;
        }

        #secretWorld { display: none; width: 100%; height: 100%; position: relative; }

        /* Background Image */
        .bg-image {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('n.png.png');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Timtimate Taare */
        .twinkling-stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
            background-image: 
                radial-gradient(2px 2px at 15% 25%, #ffffff88, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40% 10%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80% 30%, #ffffff55, rgba(0,0,0,0));
            background-size: 200px 200px;
            animation: twinkle 4s infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }

        /* --- PERFECT SHOOTING STARS --- */
        .star-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            opacity: 0;
            animation: fall 4s infinite linear;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateY(-50%) rotate(45deg); /* Tail pointing up-right */
            transform-origin: left center;
            width: 80px;
            height: 1px;
            opacity: 0.7;
        }

        /* Star Coordinates & Colors based on your data */
        /* 1. Blue/White */
        .s1 { left: 24.2%; top: 31.1%; background: #a3c2ff; animation-delay: 0s; }
        .s1::after { background: linear-gradient(90deg, rgba(163,194,255,1), transparent); }
        
        /* 2. Orange */
        .s2 { left: 38.3%; top: 34.1%; background: #ffbc7a; animation-delay: 2s; }
        .s2::after { background: linear-gradient(90deg, rgba(255,188,122,1), transparent); }
        
        /* 3. Blue/White */
        .s3 { left: 50.8%; top: 44.5%; background: #d4e1ff; animation-delay: 1.5s; }
        .s3::after { background: linear-gradient(90deg, rgba(212,225,255,1), transparent); }
        
        /* 4. Pink/Purple */
        .s4 { left: 41.1%; top: 63.2%; background: #ffa3e6; animation-delay: 3.5s; }
        .s4::after { background: linear-gradient(90deg, rgba(255,163,230,1), transparent); }
        
        /* 5. Blue/White */
        .s5 { left: 77.9%; top: 0%; background: #ffffff; animation-delay: 1s; }
        .s5::after { background: linear-gradient(90deg, #ffffff, transparent); }
        
        /* 6. Greenish White */
        .s6 { left: 92.8%; top: 5.7%; background: #b0ffdb; animation-delay: 4.5s; }
        .s6::after { background: linear-gradient(90deg, rgba(176,255,219,1), transparent); }
        
        /* 7. Orange */
        .s7 { left: 96%; top: 50.9%; background: #ffc987; animation-delay: 2.8s; }
        .s7::after { background: linear-gradient(90deg, rgba(255,201,135,1), transparent); }

        @keyframes fall {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(-150px, 150px); opacity: 0; } /* Falls down and left diagonally */
            100% { transform: translate(-150px, 150px); opacity: 0; }
        }

        /* --- WINDY LEAVES EFFECT --- */
        .falling-leaves {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            width: 8px; height: 12px;
            background: #111; /* Dark silhouette leaf */
            border-radius: 0 10px 0 10px;
            opacity: 0.6;
            animation: drift 7s infinite ease-in-out;
        }

        .l1 { left: 5%; top: 10%; animation-duration: 8s; animation-delay: 0s; }
        .l2 { left: 15%; top: -5%; animation-duration: 6s; animation-delay: 2s; }
        .l3 { left: 10%; top: 20%; animation-duration: 9s; animation-delay: 4s; }
        .l4 { left: 20%; top: 15%; animation-duration: 7s; animation-delay: 1s; }

        @keyframes drift {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translate(80px, 200px) rotate(180deg); } /* Blows right & down */
            100% { transform: translate(150px, 400px) rotate(360deg); opacity: 0; }
        }

        /* Aapke Jazbaat */
        .emotions-text {
            position: absolute;
            bottom: 8%; 
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            color: #e5e7eb;
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            line-height: 1.4;
            text-align: center;
            z-index: 5;
            text-shadow: 2px 2px 15px rgba(0,0,0,1), -1px -1px 10px rgba(0,0,0,1);
            opacity: 0;
            animation: fadeInText 5s forwards;
            animation-delay: 2.5s; 
        }
        @keyframes fadeInText { to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="secretWorld">
        <!-- Background -->
        <div class="bg-image"></div>
        
        <!-- Twinkling Stars -->
        <div class="twinkling-stars"></div>

        <!-- Shooting Stars Matching Your Coordinates -->
        <div class="star-container">
            <div class="shooting-star s1"></div>
            <div class="shooting-star s2"></div>
            <div class="shooting-star s3"></div>
            <div class="shooting-star s4"></div>
            <div class="shooting-star s5"></div>
            <div class="shooting-star s6"></div>
            <div class="shooting-star s7"></div>
        </div>

        <!-- Windy Falling Leaves -->
        <div class="falling-leaves">
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>
        </div>

        <!-- Text -->
        <div class="emotions-text">
            "Aaj 40 din guzar gaye...<br>
            Aur is akelepan mein bas yehi lagta hai,<br>
            ki shayad kahin tum bhi is aasman ko dekh rahi hogi..."
        </div>
    </div>

    <script>
        window.onload = function() {
            let loggedInRoll = localStorage.getItem("studentRoll");
            if (loggedInRoll !== "2357") {
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("secretWorld").style.display = "block";
            }
        };
    </script>
</body>
</html>
