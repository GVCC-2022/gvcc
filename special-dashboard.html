        /* =========================================
           1. SHARED DESIGN (Dono Mode ke liye same)
        ========================================= */
        body {
            margin: 0; padding: 0; background-color: #000;
            font-family: 'Playfair Display', serif;
            height: 100vh; width: 100vw; overflow: hidden; 
            position: relative;
        }

        #secretWorld { display: none; width: 100%; height: 100%; position: relative; }

        .bg-image {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            
            background-size: cover; background-position: center;
            width: 100vw; height: 100vh; z-index: 1;
        }

        /* Taare aur Any Animations */
        .twinkling-stars {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2;
            background-image: 
                radial-gradient(2px 2px at 15% 25%, #ffffff88, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40% 10%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80% 30%, #ffffff55, rgba(0,0,0,0));
            background-size: 200px 200px; animation: twinkle 4s infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }

        .star-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        .shooting-star {
            position: absolute; width: 3px; height: 3px; border-radius: 50%;
            background: var(--star-color, #fff); box-shadow: 0 0 10px var(--star-color, #fff);
            opacity: 0; animation: fall 4s infinite linear;
        }
        .shooting-star::after {
            content: ''; position: absolute; top: 50%; right: 50%; transform: translateY(-50%);
            width: 120px; height: 1.5px; background: linear-gradient(to right, transparent, var(--star-color, #fff));
        }
        @keyframes fall {
            0% { transform: rotate(135deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: rotate(135deg) translateX(250px); opacity: 0; } 
            100% { transform: rotate(135deg) translateX(250px); opacity: 0; }
        }
        
        .s1 { left: 24.2%; top: 31.1%; --star-color: #a3c2ff; animation-delay: 0s; }
        .s2 { left: 38.3%; top: 34.1%; --star-color: #ffbc7a; animation-delay: 2s; }
        .s3 { left: 50.8%; top: 44.5%; --star-color: #d4e1ff; animation-delay: 1.5s; }
        .s4 { left: 41.1%; top: 63.2%; --star-color: #ffa3e6; animation-delay: 3.5s; }
        .s5 { left: 77.9%; top: 0%;    --star-color: #ffffff; animation-delay: 1s; }
        .s6 { left: 92.8%; top: 5.7%;  --star-color: #b0ffdb; animation-delay: 4.5s; }
        .s7 { left: 96%;   top: 50.9%; --star-color: #ffc987; animation-delay: 2.8s; }
        .s8 { left: 60%; top: 15%; --star-color: #ffffff; animation-delay: 0.5s; animation-duration: 5s; }
        .s9 { left: 85%; top: 25%; --star-color: #a3c2ff; animation-delay: 3s; animation-duration: 3.5s; }
        .s10 { left: 70%; top: 55%; --star-color: #ffbc7a; animation-delay: 1.2s; animation-duration: 4.2s; }
        .s11 { left: 45%; top: 10%; --star-color: #d4e1ff; animation-delay: 4.8s; animation-duration: 3.8s; }
        .s12 { left: 30%; top: 60%; --star-color: #ffa3e6; animation-delay: 2.5s; animation-duration: 4.5s; }

        .falling-leaves { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: hidden; }
        .leaf {
            position: absolute; width: 8px; height: 12px; background: #080808; 
            border-radius: 0 10px 0 10px; opacity: 0.7; animation: drift 7s infinite ease-in-out;

        .l1 { left: 5%; top: 10%; animation-duration: 8s; animation-delay: 0s; }
        .l2 { left: 15%; top: -5%; animation-duration: 6s; animation-delay: 2s; }
        .l3 { left: 10%; top: 20%; animation-duration: 9s; animation-delay: 4s; }
        .l4 { left: 20%; top: 15%; animation-duration: 7s; animation-delay: 1s; }
        @keyframes drift {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }

/* =====================================================================
   GVCC soft-glass look - shared parts (tap sparkles, lights, liquid glass).
   Decoration only: nothing here adds or changes any text.
   ===================================================================== */

/* tap sparkles live in one layer above everything; it never catches a touch */
.fx-layer { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 2147483000; pointer-events: none; overflow: hidden; contain: layout paint; }
.fx-p {
    position: absolute; left: 0; top: 0; display: block; pointer-events: none; will-change: transform, opacity;
    background: radial-gradient(circle at 34% 28%, #ffffff 0, var(--pc, #fff) 58%, var(--pc, #fff) 100%);
}
.fx-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 2px 5px rgba(20, 20, 60, 0.22), inset -2px -3px 4px rgba(0, 0, 0, 0.12); }
.fx-star { width: 18px; height: 18px; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.fx-diamond { width: 14px; height: 14px; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.fx-heart { width: 20px; height: 18px; clip-path: path("M10 18 C2 12 0 8.5 0 5.2 C0 2.2 2.4 0 5.1 0 C7.1 0 9 1.2 10 3 C11 1.2 12.9 0 14.9 0 C17.6 0 20 2.2 20 5.2 C20 8.5 18 12 10 18 Z"); }
.fx-ripple {
    position: absolute; width: 130px; height: 130px; border-radius: 50%; pointer-events: none; will-change: transform, opacity;
    border: 2px solid var(--pc, #fff);
    background: radial-gradient(circle, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 68%);
    box-shadow: 0 0 22px var(--pc, #fff), inset 0 0 18px var(--pc, #fff);
}

/* the shared world layer (blobs, shapes, lights) */
.fx-world {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 0; overflow: hidden; pointer-events: none;
    --px: 0; --py: 0;
}

@keyframes fxRise { from { opacity: 0; translate: 0 22px; scale: 0.96; } to { opacity: 1; translate: 0 0; scale: 1; } }
@keyframes fxSpring { 0% { opacity: 0; scale: 0.5; translate: 0 -26px; } 55% { opacity: 1; } 100% { opacity: 1; scale: 1; translate: 0 0; } }
@keyframes fxShimmer { from { background-position: 0% 50%; } to { background-position: 250% 50%; } }
@keyframes fxSweep { 0% { transform: translateX(-190%) skewX(-18deg); } 46%, 100% { transform: translateX(420%) skewX(-18deg); } }
@keyframes fxBobY { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
@keyframes fxSquish { 0% { scale: 1; } 22% { scale: 1.16 0.82; } 48% { scale: 0.9 1.14; } 72% { scale: 1.06 0.97; } 100% { scale: 1; } }

/* liquid glass helpers: blur first (every browser), then the bending filter (Chrome/Edge only) */
html:not(.fx-lite) .fx-liquid {
    -webkit-backdrop-filter: blur(10px) saturate(180%) url(#fxLiquid);
    backdrop-filter: blur(10px) saturate(180%) url(#fxLiquid);
}
html.fx-lite .fx-liquid { -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

@media (prefers-reduced-motion: reduce) {
    .fx-layer { display: none; }
}

        /* =================================================================
           VIP LOOK  (only styling - no text is changed anywhere)
        ================================================================= */
        :root {
            --gold: #ecd09a;
            --gold-soft: rgba(236, 208, 154, 0.55);
            --gold-faint: rgba(236, 208, 154, 0.22);
            --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        html, body { background: #000; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        button { touch-action: manipulation; -webkit-touch-callout: none; }

        /* waiting blob while the page is being unlocked */
        #vipLoader {
            position: fixed; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; z-index: 50;
            border-radius: 50% 45% 55% 50% / 55% 50% 45% 50%;
            background: radial-gradient(circle at 32% 28%, #fff8e6 0, #ecd09a 52%, #c79a4a 100%);
            box-shadow: 0 0 34px rgba(236, 208, 154, 0.55), inset -6px -8px 12px rgba(120, 70, 0, 0.32), inset 5px 6px 9px rgba(255, 255, 255, 0.6);
            animation: fxMorph 2.6s ease-in-out infinite;
        }
        #vipLoader::before, #vipLoader::after {
            content: ""; position: absolute; left: -10px; right: -10px; top: -10px; bottom: -10px; border-radius: 50%;
            border: 1px solid rgba(236, 208, 154, 0.55); opacity: 0; animation: vipRing 2.6s ease-out infinite;
        }
        #vipLoader::after { animation-delay: 1.3s; }
        @keyframes fxMorph {
            0%, 100% { border-radius: 50% 45% 55% 50% / 55% 50% 45% 50%; transform: rotate(0deg) scale(1); }
            25% { border-radius: 42% 58% 46% 54% / 58% 44% 56% 42%; transform: rotate(90deg) scale(1.14); }
            50% { border-radius: 56% 44% 58% 42% / 44% 58% 42% 56%; transform: rotate(180deg) scale(0.92); }
            75% { border-radius: 46% 54% 42% 58% / 52% 46% 54% 48%; transform: rotate(270deg) scale(1.08); }
        }
        @keyframes vipSpin { to { transform: rotate(360deg); } }

        /* cinematic entrance: black -> scene, photo fades in and slowly settles */
        #secretWorld { background: #000; animation: vipFade 1.6s ease-out both; }
        @keyframes vipFade { from { opacity: 0; } to { opacity: 1; } }
        .bg-image {
            opacity: 0; transform: scale(1.1); will-change: transform, opacity;
            transition: opacity 1.8s ease, transform 16s var(--ease-out);
        }
        #secretWorld.vip-ready .bg-image { opacity: 1; transform: scale(1.07); }
        .bg-image { translate: calc(var(--px, 0) * -14px) calc(var(--py, 0) * -10px); }

        /* soft vignette + darker top/bottom, so the timer and the words are easy to read */
        #secretWorld::after {
            content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 4; pointer-events: none;
            background:
                radial-gradient(125% 90% at 50% 42%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.55) 100%),
                linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 40%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 24%);
        }

        /* the four lines of words appear one after another */
        .emotions-text { animation: none; opacity: 1; text-wrap: pretty; }
        .emotions-text::before {
            content: ""; position: absolute; left: -16px; right: -18px; top: -14px; bottom: -12px; z-index: -1; pointer-events: none;
            border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.16);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02)), rgba(8, 10, 30, 0.26);
            -webkit-backdrop-filter: blur(4px) saturate(150%); backdrop-filter: blur(4px) saturate(150%);
            box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, 0.28), inset 0 -10px 22px rgba(120, 130, 255, 0.08), 0 22px 40px -18px rgba(0, 0, 0, 0.7);
            opacity: 0; animation: fxFade 1.6s ease 1.1s forwards;
        }
        @keyframes fxFade { to { opacity: 1; } }
        .emotions-text .vl {
            display: block; opacity: 0; transform: translateY(10px); filter: blur(5px);
            animation: vipLine 1.8s var(--ease-out) forwards;
            animation-delay: calc(1.8s + var(--i, 0) * 1.2s);
        }
        @keyframes vipLine { to { opacity: 1; transform: none; filter: blur(0); } }

        /* timer: liquid-glass cards with a puffy rim; they drop in, then float gently */
        .live-timer { top: calc(22px + env(safe-area-inset-top, 0px)); gap: 10px; }
        .flip-card { animation: fxSpring 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) calc(0.2s + var(--n, 0) * 0.12s) backwards, fxBobY 5.5s ease-in-out calc(1.8s + var(--n, 0) * 0.55s) infinite; }

            animation: fxSpring 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) calc(0.9s + var(--n, 0) * 0.14s) backwards, fxBobY 5s ease-in-out calc(2.3s + var(--n, 0) * 0.7s) infinite;
        }

        .action-btn:nth-child(1) { --n: 0; } .action-btn:nth-child(2) { --n: 1; } .action-btn:nth-child(3) { --n: 2; }

        /* music button (icon only): bars dance while the song plays */
        .music-btn .eq { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 16px; width: 20px; }
        .music-btn .eq b { display: block; width: 3px; height: 16px; border-radius: 2px; background: currentColor; transform-origin: 50% 100%; transform: scaleY(0.28); transition: transform 0.3s ease; }
        .music-btn.on .eq b { animation: vipEq 1.1s ease-in-out infinite; }
        .music-btn.on .eq b:nth-child(2) { animation-delay: -0.35s; }
        .music-btn.on .eq b:nth-child(3) { animation-delay: -0.7s; }
        @keyframes vipEq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
        .music-btn.off { opacity: 0.6; }

            content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 2px; margin-top: -1px;
            background: currentColor; border-radius: 2px; transform: rotate(-40deg); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);

        #diarySidebar {

        .memory-btn:active { transform: scale(0.96); }

        @keyframes vipBeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.25); } 28% { transform: scale(1); } 42% { transform: scale(1.18); } 56% { transform: scale(1); } }
        @media (hover: hover) { .send-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 20px 28px -12px rgba(255, 150, 90, 0.8), inset 0 2px 1px rgba(255, 255, 255, 0.5), inset 0 -8px 12px rgba(255, 120, 80, 0.26); } }

            max-height: 45vh; overflow: auto; border-radius: 10px; background: rgba(0, 0, 0, 0.82); color: #cfe9ff;

        /* drifting lights and a shooting star over the photo (they are added by fx.js) */
        .fx-sky-world { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 3; overflow: hidden; pointer-events: none; }
        .fx-orb {
            position: absolute; bottom: -30px; border-radius: 50%; opacity: 0; will-change: transform, opacity;
            background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.95), rgba(255, 226, 170, 0.55) 46%, rgba(255, 214, 150, 0) 74%);

        /* =================================================================

        ================================================================= */
        #vipLock {
            position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 60; overflow-x: hidden; overflow-y: auto;
            display: flex; align-items: center; justify-content: center; padding: 22px 16px; box-sizing: border-box;
            background:
                radial-gradient(75% 50% at 50% -6%, rgba(99, 102, 241, 0.42), rgba(99, 102, 241, 0) 70%),

        #vipLock::before { width: 62vmax; height: 52vmax; left: -22vmax; top: -16vmax; background: radial-gradient(closest-side, rgba(56, 189, 248, 0.34), rgba(56, 189, 248, 0) 74%); }
        #vipLock::after { width: 56vmax; height: 56vmax; right: -20vmax; bottom: -20vmax; background: radial-gradient(closest-side, rgba(244, 114, 182, 0.3), rgba(244, 114, 182, 0) 74%); animation-delay: -9s; }
        @keyframes fxBlobLock {

            50% { transform: translate(7vw, 6vh) rotate(100deg) scale(1.15, 0.9); }

        #vipLockForm {
            position: relative; z-index: 4; width: min(100%, 400px); margin: auto; box-sizing: border-box; padding: 26px 20px 30px;
            border-radius: 34px; border: 1px solid rgba(255, 255, 255, 0.26);

                radial-gradient(120% 70% at 20% 0%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 58%),

            box-shadow: 0 38px 70px -26px rgba(0, 0, 0, 0.85), inset 0 1.5px 1px rgba(255, 255, 255, 0.4), inset 0 -14px 28px rgba(120, 130, 255, 0.1);
            animation: fxCardInLock 1.05s cubic-bezier(0.34, 1.3, 0.64, 1) 0.1s backwards;

        @keyframes fxCardInLock { from { opacity: 0; scale: 0.88; translate: 0 34px; } to { opacity: 1; scale: 1; translate: 0 0; } }
        #vipLockForm::before {
            content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
            background: linear-gradient(135deg, rgba(236, 208, 154, 0.95), rgba(255, 255, 255, 0.12) 40%, rgba(125, 211, 252, 0.5) 72%, rgba(244, 114, 182, 0.6));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);

        #vipLockForm { counter-reset: vq; }

        @keyframes fxShake {

        }
        .vq {

            text-shadow: 0 0 16px rgba(236, 208, 154, 0.35), 0 1px 0 rgba(0, 0, 0, 0.5);
        }
        .vq input {
            grid-column: 1 / -1; width: 100%; box-sizing: border-box; padding: 12px 18px; border-radius: 20px; color: #fff; caret-color: var(--gold);
            font: 400 24px/1.2 'Caveat', cursive; outline: none; -webkit-user-select: text; user-select: text;

    <script>/* GVCC soft-glass look: floating shapes, liquid glass filter, tap sparkles, light parallax.

    // ---------- liquid glass: an SVG filter that bends what is behind the glass (Chrome/Edge; other browsers just blur) ----------
    function addFilter() {

    // ---------- parallax: pointer / finger / phone tilt move the layers a little ----------
    var par = { x: 0, y: 0, tx: 0, ty: 0, raf: 0 };
    var parTargets = [];
    var cards = [];
    function parApply() {
        var px = par.x.toFixed(3), py = par.y.toFixed(3);

            parTargets[i].style.setProperty("--px", px);
            parTargets[i].style.setProperty("--py", py);
        }
        for (var c = 0; c < cards.length; c++) {
            var ry = par.x * 7, rx = -par.y * 5;
            if (Math.abs(rx) < 0.06 && Math.abs(ry) < 0.06) { cards[c].style.transform = ""; }
            else { cards[c].style.transform = "perspective(900px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)"; }
        }
    }
    function parTick() {
        par.raf = 0;
        par.x += (par.tx - par.x) * 0.1;
        par.y += (par.ty - par.y) * 0.1;

        if (Math.abs(par.tx - par.x) > 0.002 || Math.abs(par.ty - par.y) > 0.002) { par.raf = requestAnimationFrame(parTick); }
    }
    function parSet(x, y) {

            cards[c].style.setProperty("--my", clamp((y - r.top) / r.height * 100, -20, 120).toFixed(1) + "%");
        }
    }

    // ---------- tap sparkles ----------
    var layer = null;
    var SKY = ["#ffd7e6", "#ff9fc2", "#ffe3a3", "#ecd09a", "#ffffff", "#c9d6ff"];          // special page (dark photo)
    var NIGHT = ["#7dd3fc", "#c4b5fd", "#f9a8d4", "#fde68a", "#86efac", "#ffffff"];       // dark theme
    var DAY = ["#0ea5e9", "#8b5cf6", "#ec4899", "#f59e0b", "#10b981", "#6366f1"];         // light theme (stronger, so they show on pale glass)
    function palette() { return special ? SKY : (root.getAttribute("data-theme") === "dark" ? NIGHT : DAY); }
    var KINDS = special ? ["heart", "star", "heart", "dot", "star"] : ["star", "dot", "diamond", "star", "dot"];
    var BASE = { dot: 12, star: 18, diamond: 14, heart: 20 };

    function room() { return layer && layer.childElementCount < 90; }
    function particle(kind, color) {
        var p = el("i", "fx-p fx-" + kind);
        p.style.setProperty("--pc", color);
        return p;
    }
    function fly(p, x, y, dx, dy, fall, dur, spin, size) {

        p.style.top = y + "px";
        layer.appendChild(p);
        var k = size / BASE[p.className.split(" ")[1].slice(3)];
        if (!p.animate) { setTimeout(function () { p.remove(); }, dur); return; }
        var a = p.animate([
            { transform: "translate(-50%,-50%) translate(0,0) scale(" + (k * 0.2) + ") rotate(0deg)", opacity: 1 },
            { transform: "translate(-50%,-50%) translate(" + (dx * 0.65) + "px," + (dy * 0.65) + "px) scale(" + k + ") rotate(" + (spin * 0.5) + "deg)", opacity: 1, offset: 0.38 },
            { transform: "translate(-50%,-50%) translate(" + dx + "px," + (dy + fall) + "px) scale(" + (k * 0.15) + ") rotate(" + spin + "deg)", opacity: 0 }
        ], { duration: dur, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
        a.onfinish = function () { p.remove(); };
    }
    function ring(x, y, color) {
        var r = el("i", "fx-ripple");
        r.style.left = x + "px";
        r.style.top = y + "px";
        r.style.setProperty("--pc", color || "#ffffff");
        layer.appendChild(r);
        if (!r.animate) { setTimeout(function () { r.remove(); }, 700); return; }
        r.animate([
            { transform: "translate(-50%,-50%) scale(0.12)", opacity: 0.85 },
            { transform: "translate(-50%,-50%) scale(1)", opacity: 0 }
        ], { duration: 720, easing: "cubic-bezier(.15,.7,.25,1)", fill: "forwards" }).onfinish = function () { r.remove(); };
    }
    function burst(x, y, n, tint) {
        if (reduce || !layer) { return; }

        if (free < 3) { return; }

        if (lite) { n = Math.ceil(n / 2); }
        n = Math.min(n, free - 1);
        for (var i = 0; i < n; i++) {
            var kind = pick(KINDS), a = rnd(0, 6.2832), d = rnd(34, 96);
            fly(particle(kind, tint && i % 2 ? tint : pick(pal)), x, y,
                Math.cos(a) * d, Math.sin(a) * d - 10, rnd(18, 46), rnd(650, 1150), rnd(-160, 160), rnd(11, 24));
        }
    }
    function trail(x, y) {
        if (reduce || !layer || !room()) { return; }
        var kind = Math.random() < 0.5 ? "dot" : "star";
        fly(particle(kind, pick(palette())), x + rnd(-4, 4), y + rnd(-4, 4), rnd(-16, 16), rnd(6, 22), 18, rnd(480, 760), rnd(-90, 90), rnd(6, 11));
    }
    function rain() {
        if (reduce || !layer) { return; }
        var h = window.innerHeight, w = window.innerWidth;
        var pal = palette();
        var total = Math.min(lite ? 22 : 44, 120 - layer.childElementCount);
        for (var i = 0; i < total; i++) {
            var kind = pick(KINDS);
            var p = particle(kind, pick(pal));
            p.style.left = rnd(0, w) + "px";
            p.style.top = "-24px";
            layer.appendChild(p);
            var k = rnd(0.7, 1.35), sway = rnd(-70, 70);
            if (!p.animate) { p.remove(); continue; }

                { transform: "translate(-50%,-50%) translate(" + sway + "px," + (h * 0.55) + "px) scale(" + k + ") rotate(" + rnd(120, 420) + "deg)", opacity: 1, offset: 0.6 },
                { transform: "translate(-50%,-50%) translate(" + (sway * -0.4) + "px," + (h + 50) + "px) scale(" + k + ") rotate(" + rnd(300, 700) + "deg)", opacity: 0.9 }
            ], { duration: rnd(2200, 3800), delay: rnd(0, 700), easing: "cubic-bezier(.3,.1,.5,1)", fill: "both" }).onfinish = (function (n) { return function () { n.remove(); }; })(p);
        }
    }

    // ---------- floating shapes (home + login) ----------

        "--w:54vmax;--h:44vmax;left:-20vmax;top:-17vmax;--c:var(--fx-b1);--d:26s;--dl:-3s",
        "--w:46vmax;--h:52vmax;right:-18vmax;top:-6vmax;--c:var(--fx-b2);--d:31s;--dl:-11s",
        "--w:52vmax;--h:40vmax;left:-15vmax;bottom:-17vmax;--c:var(--fx-b3);--d:29s;--dl:-7s",
        "--w:42vmax;--h:42vmax;right:-11vmax;bottom:-15vmax;--c:var(--fx-b4);--d:34s;--dl:-16s",
        "--w:38vmax;--h:34vmax;left:28vw;top:34vh;--c:var(--fx-b5);--d:37s;--dl:-9s"
    ];

    var SHAPES = [

        ["ring", 78, 6, 21, "sky", 0.7, 12],
        ["pill", 66, 76, 24, "lilac", 1, 10],
        ["bubble", 3, 60, 26, "", 0.55, 13],
        ["squircle", 85, 38, 12, "peach", 0.85, 8.5],
        ["sphere", 22, 86, 9, "mint", 1.1, 7.5],
        ["bubble", 88, 80, 12, "", 0.6, 11],
        ["ring", 12, 36, 9, "pink", 0.8, 9.5],
        ["sphere", 58, 3, 7, "sky", 1.2, 8],

    function buildHome() {

                "--s:" + s[3] + ";--d:" + s[6] + "s;--dl:" + (-i * 1.7).toFixed(1) + "s;--fx:" + Math.round(rnd(-16, 16)) + "px;--fy:" + Math.round(rnd(-26, -10)) + "px;--r:" + Math.round(rnd(-40, 40)) + "deg");

    // ---------- special page: drifting lights + a shooting star ----------
    function attach(world) {

                "left:" + rnd(2, 96).toFixed(1) + "%;width:" + size.toFixed(1) + "px;height:" + size.toFixed(1) + "px;--o:" + rnd(0.25, 0.7).toFixed(2) +
                ";--d:" + rnd(15, 30).toFixed(1) + "s;--dl:" + (-rnd(0, 30)).toFixed(1) + "s;--sw:" + Math.round(rnd(-26, 26)) + "px"));

            if (!doc.hidden && !reduce && !lite && w.isConnected) {
                var s = el("i", "fx-shoot");
                var W = world.clientWidth || 360, H = world.clientHeight || 640;
                var sx = rnd(W * 0.45, W * 1.0), sy = rnd(H * 0.04, H * 0.26);
                var len = rnd(190, 300), ang = rnd(28, 40) * Math.PI / 180;
                s.style.left = sx + "px";
                s.style.top = sy + "px";
                s.style.transform = "rotate(" + (180 - ang * 180 / Math.PI) + "deg)";

                if (s.animate) {
                    var dx = -Math.cos(ang) * len * 1.6, dy = Math.sin(ang) * len * 1.6;

                        { translate: "0 0", opacity: 0 },
                        { translate: (dx * 0.15) + "px " + (dy * 0.15) + "px", opacity: 1, offset: 0.12 },
                        { translate: dx + "px " + dy + "px", opacity: 0 }
                    ], { duration: rnd(900, 1400), easing: "cubic-bezier(.3,.1,.6,1)", fill: "forwards" }).onfinish = function () { s.remove(); };
                } else { s.remove(); }

    }

    // ---------- slow phones: drop the heavy parts automatically ----------
    var sampled = false;
    function sampleFrames(wait) {
        if (sampled || lite || reduce || forced || navigator.webdriver) { return; }

            if (doc.hidden) { setTimeout(run, 1500); return; }
            var gaps = [], last = 0, count = 0;
            function frame(t) {

    // ---------- events ----------
    var lastTrail = 0, eggTaps = 0, eggTimer = 0, downNow = false;
    function interactive(t) {

    }

        // Turns what she types into one fixed "skeleton", so capital letters, spaces, symbols, doubled letters and
// small spelling differences do not matter. It holds no secret.
function gvccSkel(raw) {
    var s = String(raw).normalize("NFKC").toLowerCase();
    s = s.replace(/[^\p{L}\p{M}\p{N}]/gu, "");
    s = s.replace(/ph/g, "f").replace(/bh/g, "b").replace(/kh/g, "k").replace(/q/g, "k").replace(/w/g, "v").replace(/z/g, "j");
    s = s.replace(/[aeiouy]/g, "");
    s = s.replace(/(.)\1+/gu, "$1");
    return s;
}


        function fromBase64(text) {
            return Uint8Array.from(atob(text), (ch) => ch.charCodeAt(0));
        }

        // The key is made from the password AND the three answers. One of the stored (wrapped) copies of the
        // master key opens only if every answer is right; nothing here tells which answer was wrong.
        async function openWith(password, answers) {
            const secret = [password].concat(answers.map(gvccSkel)).join("\u0001");
            const baseKey = await crypto.subtle.importKey(
                "raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]
            );
            const wrapKey = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: fromBase64(LOCK.salt), iterations: LOCK.iterations, hash: "SHA-256" },
                baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
            );
            for (const wrapped of LOCK.wraps) {
                try {
                    const raw = fromBase64(wrapped);
                    const master = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, wrapKey, raw.slice(12));
                    const key = await crypto.subtle.importKey("raw", master, "AES-GCM", false, ["decrypt"]);
                    const data = fromBase64(LOCK.data);
                    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12));
                    return { content: JSON.parse(new TextDecoder().decode(plain)), key: key };
                } catch (e) { /* not this one */ }
            }
            return null;
        }

        let savedPassword = null;
        try { savedPassword = sessionStorage.getItem("gvccKey"); } catch (e) { savedPassword = null; }

        // The (encrypted) photo is only downloaded after the first song has some seconds loaded,
        // so on a slow connection the song gets all of it. Nobody who is not logged in downloads it.
        let photoRequest = null;
        function startPhotoDownload() {
            if (!photoRequest && savedPassword) {
                photoRequest = fetch("n2.dat", { priority: "low" })
                    .then((res) => res.arrayBuffer()).catch(() => null);
            }
            return photoRequest;
        }

        // The question screen: shown after the login, before anything private is opened.
        function askQuestions() {
            const lock = document.getElementById("vipLock");
            const form = document.getElementById("vipLockForm");
            const fields = Array.prototype.slice.call(form.querySelectorAll("input"));
            const loader = document.getElementById("vipLoader");
            if (loader) { loader.remove(); }
            lock.hidden = false;
            if (window.gvccFx) { try { window.gvccFx.attach(lock); } catch (e) { } }   // drifting lights (decoration only)
            // warm the browser cache with the (encrypted) photo while the answers are being typed
            try { fetch("n2.dat", { priority: "low" }).catch(function () { }); } catch (e) { }
            function wrong() {
                form.classList.remove("shake");
                void form.offsetWidth;
                form.classList.add("shake");
                fields.forEach((f) => f.classList.add("bad"));
                setTimeout(() => fields.forEach((f) => f.classList.remove("bad")), 900);
            }
            return new Promise((resolve) => {
                let busy = false;
                form.addEventListener("submit", async (ev) => {
                    ev.preventDefault();
                    if (busy) { return; }
                    if (fields.some((f) => !f.value.trim())) { wrong(); return; }
                    busy = true;
                    form.classList.add("busy");
                    let opened = null;
                    try { opened = await openWith(savedPassword, fields.map((f) => f.value)); } catch (e) { opened = null; }
                    form.classList.remove("busy");
                    busy = false;
                    if (opened) {
                        fields.forEach((f) => { f.value = ""; f.blur(); });
                        lock.classList.add("done");
                        setTimeout(() => lock.remove(), 900);
                        resolve(opened);
                    } else { wrong(); }
                });
            });
        }

                    const appModule = await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js");
                    const storeModule = await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js");
                    const app = appModule.initializeApp(firebaseConfig);
                    return { db: storeModule.getFirestore(app), collection: storeModule.collection, addDoc: storeModule.addDoc };
                })();
            }
            return firebasePromise;
        }

        // UI Open/Close Logic
        const diarySidebar = document.getElementById('diarySidebar');
        const replyModal = document.getElementById('replyModal');

        document.getElementById('openDiary').addEventListener('click', () => {
            diarySidebar.classList.add('open');
            switchAudio('diaryMusic');
        });

        document.getElementById('closeDiary').addEventListener('click', () => {
            diarySidebar.classList.remove('open');
            switchAudio('bgMusic');
        });

        document.getElementById('openReply').addEventListener('click', () => {
            replyModal.classList.add('open');
            switchAudio('pankhMusic');
        });

        document.getElementById('closeReply').addEventListener('click', () => {
            replyModal.classList.remove('open');
            switchAudio('bgMusic');
        });

        window.showMemory = function (text) {
            const box = document.getElementById('memoryDisplay');
            box.innerText = `"${text}"`;
            box.classList.remove('swap');
            void box.offsetWidth;
            box.classList.add('swap');
        };

        // The memory that is open right now gets a highlight
        document.getElementById('memoryList').addEventListener('click', (e) => {
            const btn = e.target.closest('.memory-btn');
            if (!btn) { return; }
            document.querySelectorAll('#memoryList .memory-btn.active').forEach((x) => x.classList.remove('active'));
            btn.classList.add('active');
        });

        // Save the reply in Firebase
        document.getElementById('sendReplyBtn').addEventListener('click', async function () {
            let msg = document.getElementById('replyMessage').value.trim();
            if (msg === "") return;

            let btn = this;
            btn.innerText = "Bhej raha hoon...";

            try {
                const fb = await getFirebase();
                await fb.addDoc(fb.collection(fb.db, "replies_from_2357"), {
                    message: msg,
                    timestamp: new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })
                });

                document.getElementById('replyMessage').value = "";
                btn.innerHTML = 'Message Bhej Do <i class="fa-solid fa-heart"></i>';
                document.getElementById('replyStatus').style.display = "block";

                setTimeout(() => {
                    replyModal.classList.remove('open');
                    document.getElementById('replyStatus').style.display = "none";
                    switchAudio('bgMusic');
                }, 3000);

            } catch (error) {
                console.error("Firebase Error: ", error);
                btn.innerText = "Error! Phir se try karein.";
            }
        });
</script>
</body>
</html>
