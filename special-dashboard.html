                return;
            }
            playing.forEach((o) => { if (o !== t) { bufStop(o, 0.25); } });
            bufStart(t, 0.4);
            showMusicState("on");
            bufPrefetch();
        }
        // Once the first song plays (and the photo is in), the other songs are downloaded and decoded one after
        // the other, so opening the diary or the message box switches the song at once.
        let bufPrefetched = false;
        function bufPrefetch() {
            if (bufPrefetched || !keepDecoded) { return; }
            bufPrefetched = true;
            Promise.race([photoDone, new Promise((r) => setTimeout(r, 15000))]).then(() => {
                let chain = Promise.resolve();
                ["pankhMusic", "diaryMusic"].forEach((id) => {
                    chain = chain.then(() => bufLoad(bufTrack(id), true)).catch(() => { });
                });
            });
        }
        function bufResume() {
            bufTrack(bufWanted).fails = 0;
            try { const p = bufCtx().resume(); if (p && p.catch) { p.catch(() => { }); } } catch (e) { }
            bufSync();
        }
        function enterBufferMode() {
            if (buf.entered) { return; }
            buf.entered = true;
            mode = "buffer";
            try { localStorage.setItem("gvccSongMode", "buffer"); } catch (e) { }
            noteBuf("using Web Audio");
            disarmUnlock();
            audios.forEach((a) => {                    // the <audio> tags are not used any more
                clearHold(a);
                pauseTrack(a);
                a._parked = true;
                a.removeAttribute("src");
                a.load();
                a._ours = false;
            });
            bufWanted = currentAudio.id;
            bufSync();
        }

        function switchAudio(newAudioId) {
            const next = document.getElementById(newAudioId);
            currentAudio = next;
            if (mode === "buffer") { bufWanted = newAudioId; bufSync(); return; }
            // a song that is only half-loaded is dropped at once; the one that is really heard
            // keeps playing until the new song is ready, then they cross-fade
            audios.forEach((a) => {
                if (a === next) { return; }
                clearHold(a);
                if (!a.paused && !isAudible(a)) { pauseTrack(a); a.volume = VOLUME; }
                if (a.paused) { parkTrack(a); }
            });
            startTrack(next, true);
        }

        // If the browser blocks the song, wait for the first tap / key press and start it then.
        let unlockArmed = false;
        function isControl(el) {
            return !!(el && el.closest && el.closest("button, a, input, textarea, select, label, [onclick]"));
        }
        function tryUnlock() {
            if (userMuted) { return; }
            if (mode === "buffer") { bufResume(); return; }
            if (!currentAudio.paused) { disarmUnlock(); return; }
            startTrack(currentAudio, true).then((ok) => { if (ok) { disarmUnlock(); } });
        }
        function onTouchEnd(e) { if (!isControl(e.target)) { tryUnlock(); } }
        function armUnlock() {
            if (unlockArmed) { return; }
            unlockArmed = true;
            document.addEventListener("click", tryUnlock);      // bubbling: runs after the button's own handler
            document.addEventListener("keydown", tryUnlock);
            document.addEventListener("touchend", onTouchEnd);
        }
        function disarmUnlock() {
            unlockArmed = false;
            document.removeEventListener("click", tryUnlock);
            document.removeEventListener("keydown", tryUnlock);
            document.removeEventListener("touchend", onTouchEnd);
        }

        audios.forEach((a) => {
            ["playing", "pause", "waiting", "stalled", "error", "ended", "canplay"].forEach((name) => {
                a.addEventListener(name, () => noteEvent(a, name));
            });
            a.addEventListener("progress", () => { if (a._hold && loadedEnough(a)) { releaseHold(a); } });
            a.addEventListener("canplaythrough", () => { if (a._hold) { releaseHold(a); } });
            a.addEventListener("playing", () => {
                a._retries = 0;
                a._played = true;
                if (a === currentAudio) { showMusicState("on"); fadeOutOthers(); }
            });
            a.addEventListener("waiting", () => {
                if (a === currentAudio && !a.paused && !userMuted) {
                    showMusicState("load");
                    // Stopping and starting every few seconds is worse than one wait: collect a cushion first.
                    if (!loadedEnough(a)) { holdTrack(a); }
                }
            });
            a.addEventListener("pause", () => {
                if (a._ours) { a._ours = false; return; }
                // Paused by the browser right after it started: switch to the Web Audio player.
                if (mode === "element" && a === currentAudio && !document.hidden && !userMuted
                    && performance.now() - (a._lastPlay || 0) < 6000) { enterBufferMode(); return; }
                // Not paused by us (phone call, another app took the sound, ...): next tap starts it again.
                if (a === currentAudio && !document.hidden && !userMuted) { showMusicState("wait"); armUnlock(); }
            });
            a.addEventListener("error", () => {
                clearHold(a);
                a._retries = (a._retries || 0) + 1;
                if (a._retries > 3) { return; }
                setTimeout(() => {
                    a.load();
                    if (a === currentAudio && !document.hidden) { startTrack(a, true); }
                }, 1500);
            });
        });

        // Leaving the page (home button, other app or tab, screen off, window not in front): sound off at once.
        function silenceNow() {
            away = true;
            if (mode === "buffer") { bufPlaying().forEach((t) => bufStop(t, 0)); }
            audios.forEach(pauseTrack);
        }
        function backNow() {
            if (!away || document.hidden) { return; }
            away = false;
            if (userMuted) { return; }
            if (mode === "buffer") { bufResume(); } else { startTrack(currentAudio, true); }
        }
        document.addEventListener("visibilitychange", function () {
            if (document.hidden) { silenceNow(); } else { backNow(); }
        });
        window.addEventListener("pagehide", silenceNow);
        window.addEventListener("pageshow", backNow);
        window.addEventListener("blur", silenceNow);
        window.addEventListener("focus", backNow);
        // Safety net: touching the visible page means the person is back, even if no "focus" event came.
        ["pointerdown", "touchend", "keydown"].forEach((n) => document.addEventListener(n, backNow, true));

        if (musicBtn) {
            let longPress = false;
            let pressTimer = null;
            const diag = document.createElement("pre");
            diag.id = "vipDiag";
            document.body.appendChild(diag);
            let diagTimer = null;
            function showDiag() {
                const a = currentAudio;
                const c = navigator.connection || {};
                const lines = [
                    `song=${a.id} src=${a.getAttribute("src")}`,
                    `paused=${a.paused} t=${a.currentTime.toFixed(1)}/${isFinite(a.duration) ? a.duration.toFixed(0) : "?"} ready=${a.readyState} net=${a.networkState} err=${a.error ? a.error.code : 0}`,
                    `buffered=${a.buffered.length ? a.buffered.end(a.buffered.length - 1).toFixed(0) + "s" : "0s"} ahead=${aheadOf(a).toFixed(0)}s hold=${!!a._hold} muted=${userMuted} hidden=${document.hidden}`,
                    `mode=${mode}` + (mode === "buffer" ? ` ctx=${buf.ctx ? buf.ctx.state : "-"} want=${bufWanted} playing=${bufPlaying().map((t) => t.id).join("+") || "-"}` : ""),
                    `online=${navigator.onLine} link=${c.effectiveType || "?"} ${c.downlink || "?"}Mbps`,
                    "---"
                ].concat(audioEvents.slice(-9));
                diag.textContent = lines.join("\n");
            }
            diag.addEventListener("click", () => { diag.style.display = "none"; clearInterval(diagTimer); });
            const startPress = () => {
                longPress = false;
                clearTimeout(pressTimer);
                pressTimer = setTimeout(() => {
                    longPress = true;
                    diag.style.display = "block";
                    showDiag();
                    clearInterval(diagTimer);
                    diagTimer = setInterval(showDiag, 500);
                }, 1300);
            };
            const endPress = () => clearTimeout(pressTimer);
            musicBtn.addEventListener("pointerdown", startPress);
            ["pointerup", "pointerleave", "pointercancel"].forEach((n) => musicBtn.addEventListener(n, endPress));
            musicBtn.addEventListener("contextmenu", (e) => e.preventDefault());

            musicBtn.addEventListener("click", () => {
                if (longPress) { longPress = false; return; }     // long press only opens the status box
                if (mode === "buffer") {
                    if (!userMuted && bufPlaying().length) { userMuted = true; bufSync(); } else { userMuted = false; bufResume(); }
                    return;
                }
                if (!userMuted && (!currentAudio.paused || currentAudio._hold)) {
                    userMuted = true;
                    audios.forEach((a) => { clearHold(a); pauseTrack(a); });
                    showMusicState("off");
                } else {
                    userMuted = false;
                    startTrack(currentAudio, true);
                }
            });
        }

        if (mode === "buffer") { enterBufferMode(); } else { startTrack(currentAudio, true); }
        showPhoto();

        // Last memory button
        const lastBtn = document.getElementById('lastMemoryBtn');
        if (lastBtn) {
            lastBtn.onclick = function () { window.showMemory(content.last); };
        }

        // Firebase is loaded only when a reply is sent
        const firebaseConfig = {
            apiKey: "AIzaSyBJX_dyLK80p2rNqSVvGY67TpWV7e_UdPI",
            authDomain: "gvcc-database.firebaseapp.com",
            projectId: "gvcc-database",
            storageBucket: "gvcc-database.firebasestorage.app",
            messagingSenderId: "1063216875940",
            appId: "1:1063216875940:web:a4ee2f39b01896b44c5931"
        };

        let firebasePromise = null;
        function getFirebase() {
            if (!firebasePromise) {
                firebasePromise = (async () => {
                    const appModule = await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js");
                    const storeModule = await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js");
                    const app = appModule.initializeApp(firebaseConfig);
                    return { db: storeModule.getFirestore(app), collection: storeModule.collection, addDoc: storeModule.addDoc };
                })();
            }
            return firebasePromise;
        }

        // UI Open/Close Logic
        const diarySidebar = document.getElementById('diarySidebar');
        const replyModal = document.getElementById('replyModal');

        document.getElementById('openDiary').addEventListener('click', () => {
            diarySidebar.classList.add('open');
            switchAudio('diaryMusic');
        });

        document.getElementById('closeDiary').addEventListener('click', () => {
            diarySidebar.classList.remove('open');
            switchAudio('bgMusic');
        });

        document.getElementById('openReply').addEventListener('click', () => {
            replyModal.classList.add('open');
            switchAudio('pankhMusic');
        });

        document.getElementById('closeReply').addEventListener('click', () => {
            replyModal.classList.remove('open');
            switchAudio('bgMusic');
        });

        window.showMemory = function (text) {
            const box = document.getElementById('memoryDisplay');
            box.innerText = `"${text}"`;
            box.classList.remove('swap');
            void box.offsetWidth;
            box.classList.add('swap');
        };

        // The memory that is open right now gets a highlight
        document.getElementById('memoryList').addEventListener('click', (e) => {
            const btn = e.target.closest('.memory-btn');
            if (!btn) { return; }
            document.querySelectorAll('#memoryList .memory-btn.active').forEach((x) => x.classList.remove('active'));
            btn.classList.add('active');
        });

        // Save the reply in Firebase
        document.getElementById('sendReplyBtn').addEventListener('click', async function () {
            let msg = document.getElementById('replyMessage').value.trim();
            if (msg === "") return;

            let btn = this;
            btn.innerText = "Bhej raha hoon...";

            try {
                const fb = await getFirebase();
                await fb.addDoc(fb.collection(fb.db, "replies_from_2357"), {
                    message: msg,
                    timestamp: new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })
                });

                document.getElementById('replyMessage').value = "";
                btn.innerHTML = 'Message Bhej Do ' + HEART_SVG;
                document.getElementById('replyStatus').style.display = "block";

                setTimeout(() => {
                    replyModal.classList.remove('open');
                    document.getElementById('replyStatus').style.display = "none";
                    switchAudio('bgMusic');
                }, 3000);

            } catch (error) {
                console.error("Firebase Error: ", error);
                btn.innerText = "Error! Phir se try karein.";
            }
        });
</script>
