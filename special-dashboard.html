<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GVCC</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           1. SHARED DESIGN (Dono Mode ke liye same)
        ========================================= */
        body {
            margin: 0; padding: 0; background-color: #000;
            font-family: 'Playfair Display', serif;
            height: 100vh; width: 100vw; overflow: hidden; 
            position: relative;
        }

        #secretWorld { display: none; width: 100%; height: 100%; position: relative; }

        .bg-image {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            
            background-size: cover; background-position: center;
            width: 100vw; height: 100vh; z-index: 1;
        }

        /* Taare aur Any Animations */
        .twinkling-stars {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2;
            background-image: 
                radial-gradient(2px 2px at 15% 25%, #ffffff88, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40% 10%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80% 30%, #ffffff55, rgba(0,0,0,0));
            background-size: 200px 200px; animation: twinkle 4s infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }

        .star-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        .shooting-star {
            position: absolute; width: 3px; height: 3px; border-radius: 50%;
            background: var(--star-color, #fff); box-shadow: 0 0 10px var(--star-color, #fff);
            opacity: 0; animation: fall 4s infinite linear;
        }
        .shooting-star::after {
            content: ''; position: absolute; top: 50%; right: 50%; transform: translateY(-50%);
            width: 120px; height: 1.5px; background: linear-gradient(to right, transparent, var(--star-color, #fff));
        }
        @keyframes fall {
            0% { transform: rotate(135deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: rotate(135deg) translateX(250px); opacity: 0; } 
            100% { transform: rotate(135deg) translateX(250px); opacity: 0; }
        }
        
        .s1 { left: 24.2%; top: 31.1%; --star-color: #a3c2ff; animation-delay: 0s; }
        .s2 { left: 38.3%; top: 34.1%; --star-color: #ffbc7a; animation-delay: 2s; }
        .s3 { left: 50.8%; top: 44.5%; --star-color: #d4e1ff; animation-delay: 1.5s; }
        .s4 { left: 41.1%; top: 63.2%; --star-color: #ffa3e6; animation-delay: 3.5s; }
        .s5 { left: 77.9%; top: 0%;    --star-color: #ffffff; animation-delay: 1s; }
        .s6 { left: 92.8%; top: 5.7%;  --star-color: #b0ffdb; animation-delay: 4.5s; }
        .s7 { left: 96%;   top: 50.9%; --star-color: #ffc987; animation-delay: 2.8s; }
        .s8 { left: 60%; top: 15%; --star-color: #ffffff; animation-delay: 0.5s; animation-duration: 5s; }
        .s9 { left: 85%; top: 25%; --star-color: #a3c2ff; animation-delay: 3s; animation-duration: 3.5s; }
        .s10 { left: 70%; top: 55%; --star-color: #ffbc7a; animation-delay: 1.2s; animation-duration: 4.2s; }
        .s11 { left: 45%; top: 10%; --star-color: #d4e1ff; animation-delay: 4.8s; animation-duration: 3.8s; }
        .s12 { left: 30%; top: 60%; --star-color: #ffa3e6; animation-delay: 2.5s; animation-duration: 4.5s; }

        .falling-leaves { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: hidden; }
        .leaf {
            position: absolute; width: 8px; height: 12px; background: #080808; 
            border-radius: 0 10px 0 10px; opacity: 0.7; animation: drift 7s infinite ease-in-out;
        }
        .l1 { left: 5%; top: 10%; animation-duration: 8s; animation-delay: 0s; }
        .l2 { left: 15%; top: -5%; animation-duration: 6s; animation-delay: 2s; }
        .l3 { left: 10%; top: 20%; animation-duration: 9s; animation-delay: 4s; }
        .l4 { left: 20%; top: 15%; animation-duration: 7s; animation-delay: 1s; }
        @keyframes drift {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translate(80px, 200px) rotate(180deg); } 
            100% { transform: translate(150px, 400px) rotate(360deg); opacity: 0; }
        }

        .glass-panel {
            position: absolute; background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); color: #e5e7eb;
            z-index: 20; transition: all 0.4s ease-in-out;
        }
        #diarySidebar::-webkit-scrollbar { width: 4px; }
        #diarySidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        @keyframes fadeInText { to { opacity: 1; } }

        /* =========================================
           2. 📱 MOBILE PAGE DESIGN 📱
        ========================================= */
        @media (max-width: 768px) {
            .emotions-text {
                position: absolute; bottom: 8%; right: 5%; width: 280px; 
                color: #e5e7eb; font-family: 'Caveat', cursive; font-size: 20px; 
                line-height: 1.4; text-align: right; z-index: 5;
                text-shadow: 2px 2px 15px rgba(0,0,0,1), -1px -1px 10px rgba(0,0,0,1);
                opacity: 0; animation: fadeInText 5s forwards; animation-delay: 1.5s; 
            }
            .action-buttons { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
            .action-btn { width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); color: #fff; display: flex; justify-content: center; align-items: center; }
            
            #diarySidebar { top: 0; right: -100%; width: 320px; height: 100vh; padding: 25px 15px; box-sizing: border-box; border-left: 1px solid rgba(255, 255, 255, 0.2); overflow-y: auto; }
            #diarySidebar.open { right: 0; }
            .sidebar-title { font-size: 24px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
            .memory-btn { background: rgba(255,255,255,0.05); border: none; border-left: 2px solid #a3c2ff; color: #d1d5db; width: 100%; text-align: left; padding: 12px; margin-bottom: 10px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 15px; }
            .memory-display { margin-top: 20px; font-family: 'Caveat', cursive; font-size: 22px; line-height: 1.4; color: #fff; padding-bottom: 20px; }

            #replyModal { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); width: 90%; max-width: 350px; border-radius: 20px; padding: 20px; opacity: 0; pointer-events: none; box-sizing: border-box; }
            #replyModal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: all; }
            .reply-textarea { width: 100%; height: 110px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 15px; box-sizing: border-box; color: #fff; font-family: 'Caveat', cursive; font-size: 18px; resize: none; margin-top: 15px; }
            .send-btn { background: transparent; border: 1px solid #ffbc7a; color: #ffbc7a; padding: 10px 20px; border-radius: 30px; cursor: pointer; margin-top: 15px; width: 100%; font-size: 16px; font-family: 'Playfair Display', serif; }
            .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        }

        /* =========================================
           3. 💻 DESKTOP PAGE DESIGN 💻
        ========================================= */
        @media (min-width: 769px) {
            .emotions-text {
                position: absolute; bottom: 10%; right: 5%; width: 450px; 
                color: #e5e7eb; font-family: 'Caveat', cursive; font-size: 38px; 
                line-height: 1.5; text-align: right; z-index: 5;
                text-shadow: 2px 2px 20px rgba(0,0,0,1), -1px -1px 15px rgba(0,0,0,1);
                opacity: 0; animation: fadeInText 5s forwards; animation-delay: 1.5s; 
            }
            .action-buttons { position: absolute; top: 30px; right: 30px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
            .action-btn { width: 65px; height: 65px; border-radius: 50%; font-size: 26px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); color: #fff; display: flex; justify-content: center; align-items: center; }
            
            #diarySidebar { top: 0; right: -100%; width: 450px; height: 100vh; padding: 40px 30px; box-sizing: border-box; border-left: 1px solid rgba(255, 255, 255, 0.2); overflow-y: auto; }
            #diarySidebar.open { right: 0; }
            .sidebar-title { font-size: 34px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; }
            .memory-btn { background: rgba(255,255,255,0.05); border: none; border-left: 3px solid #a3c2ff; color: #d1d5db; width: 100%; text-align: left; padding: 18px; margin-bottom: 15px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 18px; }
            .memory-display { margin-top: 30px; font-family: 'Caveat', cursive; font-size: 32px; line-height: 1.5; color: #fff; padding-bottom: 30px; }

            #replyModal { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); width: 500px; border-radius: 20px; padding: 40px; opacity: 0; pointer-events: none; box-sizing: border-box; }
            #replyModal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: all; }
            .reply-textarea { width: 100%; height: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 20px; box-sizing: border-box; color: #fff; font-family: 'Caveat', cursive; font-size: 26px; resize: none; margin-top: 20px; }
            .send-btn { background: transparent; border: 1px solid #ffbc7a; color: #ffbc7a; padding: 15px 30px; border-radius: 30px; cursor: pointer; margin-top: 25px; width: 100%; font-size: 22px; font-family: 'Playfair Display', serif; }
            .close-btn { position: absolute; top: 20px; right: 25px; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; }
        }

        /* =========================================
           4. ⏱️ REAL 3D PAGE FLIP TIMER CSS ⏱️
        ========================================= */
        .live-timer {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10;
            perspective: 800px; 
        }
        .flip-card { display: flex; flex-direction: column; align-items: center; }
        
        .flip-card span {
            background: rgba(25, 25, 25, 0.85); color: #fff; font-family: 'Courier New', Courier, monospace;
            font-size: clamp(1.4rem, 5vw, 1.8rem); font-weight: bold;
            padding: 10px 14px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 2px 2px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            display: inline-block;
        }

        .flip-card small {
            color: #ffbc7a; font-family: sans-serif; font-size: 11px; margin-top: 6px; 
            text-transform: uppercase; letter-spacing: 1px; font-weight: bold;
        }
    
        /* ===== Fixed screen: the same picture on phone, tablet and desktop ===== */
        @media (min-width: 769px) {
            .emotions-text {
                position: absolute; bottom: 8%; right: 5%; width: 280px;

            #diarySidebar { top: 0; right: -100%; width: 320px; height: 100vh; padding: 25px 15px; box-sizing: border-box; border-left: 1px solid rgba(255, 255, 255, 0.2); overflow-y: auto; }
            #diarySidebar.open { right: 0; }
            .sidebar-title { font-size: 24px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
            .memory-btn { background: rgba(255,255,255,0.05); border: none; border-left: 2px solid #a3c2ff; color: #d1d5db; width: 100%; text-align: left; padding: 12px; margin-bottom: 10px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 15px; }
            .memory-display { margin-top: 20px; font-family: 'Caveat', cursive; font-size: 22px; line-height: 1.4; color: #fff; padding-bottom: 20px; }

            #replyModal { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); width: 90%; max-width: 350px; border-radius: 20px; padding: 20px; opacity: 0; pointer-events: none; box-sizing: border-box; }
            #replyModal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: all; }
            .reply-textarea { width: 100%; height: 110px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 15px; box-sizing: border-box; color: #fff; font-family: 'Caveat', cursive; font-size: 18px; resize: none; margin-top: 15px; }
            .send-btn { background: transparent; border: 1px solid #ffbc7a; color: #ffbc7a; padding: 10px 20px; border-radius: 30px; cursor: pointer; margin-top: 15px; width: 100%; font-size: 16px; font-family: 'Playfair Display', serif; }
            .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        }
        html, body { overflow: hidden; overscroll-behavior: none; background: #000; }
        #secretWorld { overflow: hidden; width: min(100vw, calc(100vh * 0.56280)); height: 100vh; margin: 0 auto; }
        @supports (height: 100dvh) { #secretWorld { width: min(100vw, calc(100dvh * 0.56280)); height: 100dvh; } }
        .bg-image { width: 100%; height: 100%; }
        #diarySidebar { height: 100%; }
    </style>

        const ITERATIONS = 600000;

        function fromBase64(text) {
            return Uint8Array.from(atob(text), (ch) => ch.charCodeAt(0));
        }

        async function unlock(password) {
            const raw = fromBase64(CIPHER);
            const salt = raw.slice(0, 16);
            const iv = raw.slice(16, 28);
            const data = raw.slice(28);
            const baseKey = await crypto.subtle.importKey(
                "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
            );
            const key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
                baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
            );
            const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
            return { content: JSON.parse(new TextDecoder().decode(plain)), key: key };
        }
