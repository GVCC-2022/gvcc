<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>GVCC</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. SHARED DESIGN (Dono Mode ke liye same)
        ========================================= */
        body {
            margin: 0; padding: 0; background-color: #000;
            font-family: 'Playfair Display', serif;
            height: 100vh; width: 100vw; overflow: hidden; 
            position: relative;
        }

        #secretWorld { display: none; width: 100%; height: 100%; position: relative; }

        .bg-image {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            
            background-size: cover; background-position: center;
            width: 100vw; height: 100vh; z-index: 1;
        }

        /* Taare aur Any Animations */
        .twinkling-stars {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2;
            background-image: 
                radial-gradient(2px 2px at 15% 25%, #ffffff88, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40% 10%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80% 30%, #ffffff55, rgba(0,0,0,0));
            background-size: 200px 200px; animation: twinkle 4s infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }

        .star-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
        .shooting-star {
            position: absolute; width: 3px; height: 3px; border-radius: 50%;
            background: var(--star-color, #fff); box-shadow: 0 0 10px var(--star-color, #fff);
            opacity: 0; animation: fall 4s infinite linear;
        }
        .shooting-star::after {
            content: ''; position: absolute; top: 50%; right: 50%; transform: translateY(-50%);
            width: 120px; height: 1.5px; background: linear-gradient(to right, transparent, var(--star-color, #fff));
        }
        @keyframes fall {
            0% { transform: rotate(135deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: rotate(135deg) translateX(250px); opacity: 0; } 
            100% { transform: rotate(135deg) translateX(250px); opacity: 0; }
        }
        
        .s1 { left: 24.2%; top: 31.1%; --star-color: #a3c2ff; animation-delay: 0s; }
        .s2 { left: 38.3%; top: 34.1%; --star-color: #ffbc7a; animation-delay: 2s; }
        .s3 { left: 50.8%; top: 44.5%; --star-color: #d4e1ff; animation-delay: 1.5s; }
        .s4 { left: 41.1%; top: 63.2%; --star-color: #ffa3e6; animation-delay: 3.5s; }
        .s5 { left: 77.9%; top: 0%;    --star-color: #ffffff; animation-delay: 1s; }
        .s6 { left: 92.8%; top: 5.7%;  --star-color: #b0ffdb; animation-delay: 4.5s; }
        .s7 { left: 96%;   top: 50.9%; --star-color: #ffc987; animation-delay: 2.8s; }
        .s8 { left: 60%; top: 15%; --star-color: #ffffff; animation-delay: 0.5s; animation-duration: 5s; }
        .s9 { left: 85%; top: 25%; --star-color: #a3c2ff; animation-delay: 3s; animation-duration: 3.5s; }
        .s10 { left: 70%; top: 55%; --star-color: #ffbc7a; animation-delay: 1.2s; animation-duration: 4.2s; }
        .s11 { left: 45%; top: 10%; --star-color: #d4e1ff; animation-delay: 4.8s; animation-duration: 3.8s; }
        .s12 { left: 30%; top: 60%; --star-color: #ffa3e6; animation-delay: 2.5s; animation-duration: 4.5s; }

        .falling-leaves { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: hidden; }
        .leaf {
            position: absolute; width: 8px; height: 12px; background: #080808; 
            border-radius: 0 10px 0 10px; opacity: 0.7; animation: drift 7s infinite ease-in-out;
        }
        .l1 { left: 5%; top: 10%; animation-duration: 8s; animation-delay: 0s; }
        .l2 { left: 15%; top: -5%; animation-duration: 6s; animation-delay: 2s; }
        .l3 { left: 10%; top: 20%; animation-duration: 9s; animation-delay: 4s; }
        .l4 { left: 20%; top: 15%; animation-duration: 7s; animation-delay: 1s; }
        @keyframes drift {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translate(80px, 200px) rotate(180deg); } 
            100% { transform: translate(150px, 400px) rotate(360deg); opacity: 0; }
        }

        .glass-panel {
            position: absolute; background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); color: #e5e7eb;
            z-index: 20; transition: all 0.4s ease-in-out;
        }
        #diarySidebar::-webkit-scrollbar { width: 4px; }
        #diarySidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        @keyframes fadeInText { to { opacity: 1; } }

        /* =========================================
           2. 📱 MOBILE PAGE DESIGN 📱
        ========================================= */
        @media (max-width: 768px) {
            .emotions-text {
                position: absolute; bottom: 8%; right: 5%; width: 280px; 
                color: #e5e7eb; font-family: 'Caveat', cursive; font-size: 20px;

            }
            .action-buttons { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
            .action-btn { width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); color: #fff; display: flex; justify-content: center; align-items: center; }
            
            #diarySidebar { top: 0; right: -100%; width: 320px; height: 100vh; padding: 25px 15px; box-sizing: border-box; border-left: 1px solid rgba(255, 255, 255, 0.2); overflow-y: auto; }
            #diarySidebar.open { right: 0; }
            .sidebar-title { font-size: 24px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
            .memory-btn { background: rgba(255,255,255,0.05); border: none; border-left: 2px solid #a3c2ff; color: #d1d5db; width: 100%; text-align: left; padding: 12px; margin-bottom: 10px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 15px; }
            .memory-display { margin-top: 20px; font-family: 'Caveat', cursive; font-size: 22px; line-height: 1.4; color: #fff; padding-bottom: 20px; }

            #replyModal { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); width: 90%; max-width: 350px; border-radius: 20px; padding: 20px; opacity: 0; pointer-events: none; box-sizing: border-box; }
            #replyModal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: all; }
            .reply-textarea { width: 100%; height: 110px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 15px; box-sizing: border-box; color: #fff; font-family: 'Caveat', cursive; font-size: 18px; resize: none; margin-top: 15px; }
            .send-btn { background: transparent; border: 1px solid #ffbc7a; color: #ffbc7a; padding: 10px 20px; border-radius: 30px; cursor: pointer; margin-top: 15px; width: 100%; font-size: 16px; font-family: 'Playfair Display', serif; }
            .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        }

        /* =========================================
           3. 💻 DESKTOP PAGE DESIGN 💻
        ========================================= */
        @media (min-width: 769px) {
            .emotions-text {
                position: absolute; bottom: 10%; right: 5%; width: 450px; 
                color: #e5e7eb; font-family: 'Caveat', cursive; font-size: 38px; 
                line-height: 1.5; text-align: right; z-index: 5;
                text-shadow: 2px 2px 20px rgba(0,0,0,1), -1px -1px 15px rgba(0,0,0,1);
                opacity: 0; animation: fadeInText 5s forwards; animation-delay: 1.5s; 
            }
            .action-buttons { position: absolute; top: 30px; right: 30px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
            .action-btn { width: 65px; height: 65px; border-radius: 50%; font-size: 26px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); color: #fff; display: flex; justify-content: center; align-items: center; }
            
            #diarySidebar { top: 0; right: -100%; width: 450px; height: 100vh; padding: 40px 30px; box-sizing: border-box; border-left: 1px solid rgba(255, 255, 255, 0.2); overflow-y: auto; }
            #diarySidebar.open { right: 0; }
            .sidebar-title { font-size: 34px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; }
            .memory-btn { background: rgba(255,255,255,0.05); border: none; border-left: 3px solid #a3c2ff; color: #d1d5db; width: 100%; text-align: left; padding: 18px; margin-bottom: 15px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 18px; }
            .memory-display { margin-top: 30px; font-family: 'Caveat', cursive; font-size: 32px; line-height: 1.5; color: #fff; padding-bottom: 30px; }

            #replyModal { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); width: 500px; border-radius: 20px; padding: 40px; opacity: 0; pointer-events: none; box-sizing: border-box; }
            #replyModal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: all; }
            .reply-textarea { width: 100%; height: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 20px; box-sizing: border-box; color: #fff; font-family: 'Caveat', cursive; font-size: 26px; resize: none; margin-top: 20px; }
            .send-btn { background: transparent; border: 1px solid #ffbc7a; color: #ffbc7a; padding: 15px 30px; border-radius: 30px; cursor: pointer; margin-top: 25px; width: 100%; font-size: 22px; font-family: 'Playfair Display', serif; }
            .close-btn { position: absolute; top: 20px; right: 25px; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; }
        }

        /* =========================================
           4. ⏱️ REAL 3D PAGE FLIP TIMER CSS ⏱️
        ========================================= */
        .live-timer {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10;
            perspective: 800px; 
        }
        .flip-card { display: flex; flex-direction: column; align-items: center; }
        
        .flip-card span {
            background: rgba(25, 25, 25, 0.85); color: #fff; font-family: 'Courier New', Courier, monospace;
            font-size: clamp(1.4rem, 5vw, 1.8rem); font-weight: bold;
            padding: 10px 14px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 2px 2px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            display: inline-block;
        }

        .flip-card small {
            color: #ffbc7a; font-family: sans-serif; font-size: 11px; margin-top: 6px; 
            text-transform: uppercase; letter-spacing: 1px; font-weight: bold;
        }

        html, body { overflow: hidden; overscroll-behavior: none; background: #000; }
        #secretWorld { overflow: hidden; width: min(100vw, calc(100vh * 0.56280)); height: 100vh; margin: 0 auto; }
        @supports (height: 100dvh) { #secretWorld { width: min(100vw, calc(100dvh * 0.56280)); height: 100dvh; } }
        .bg-image { width: 100%; height: 100%; }
        #diarySidebar { height: 100%; }
        /* =================================================================
           VIP LOOK  (only styling - no text is changed anywhere)
        ================================================================= */
        :root {
            --gold: #ecd09a;
            --gold-soft: rgba(236, 208, 154, 0.55);
            --gold-faint: rgba(236, 208, 154, 0.22);
            --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        html, body { background: #000; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        button { touch-action: manipulation; -webkit-touch-callout: none; }

        /* waiting ring while the page is being unlocked */
        #vipLoader {
            position: fixed; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
            border-radius: 50%; border: 2px solid var(--gold-faint); border-top-color: var(--gold);
            animation: vipSpin 0.9s linear infinite; z-index: 50;
        }
        @keyframes vipSpin { to { transform: rotate(360deg); } }

        /* cinematic entrance: black -> scene, photo fades in and slowly settles */
        #secretWorld { background: #000; animation: vipFade 1.6s ease-out both; }
        @keyframes vipFade { from { opacity: 0; } to { opacity: 1; } }
        .bg-image {
            opacity: 0; transform: scale(1.1); will-change: transform, opacity;
            transition: opacity 1.8s ease, transform 16s var(--ease-out);
        }
        #secretWorld.vip-ready .bg-image { opacity: 1; transform: scale(1); }

        /* soft vignette + darker top/bottom, so the timer and the words are easy to read */
        #secretWorld::after {
            content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 4; pointer-events: none;
            background:
                radial-gradient(125% 90% at 50% 42%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.55) 100%),
                linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 40%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 24%);
        }

        /* the four lines of words appear one after another */
        .emotions-text { animation: none; opacity: 1; text-wrap: pretty; }
        .emotions-text .vl {
            display: block; opacity: 0; transform: translateY(10px); filter: blur(5px);
            animation: vipLine 1.8s var(--ease-out) forwards;
            animation-delay: calc(1.8s + var(--i, 0) * 1.2s);
        }
        @keyframes vipLine { to { opacity: 1; transform: none; filter: blur(0); } }

        /* timer: glass flip-cards with a gold edge */
        .live-timer { top: calc(22px + env(safe-area-inset-top, 0px)); gap: 10px; }
        .flip-card span {
            position: relative; color: #fff6e0; min-width: 1.45em; text-align: center; padding: 10px 9px;
            background: linear-gradient(180deg, rgba(52, 50, 58, 0.82) 0%, rgba(16, 16, 22, 0.9) 49.5%, rgba(26, 24, 32, 0.88) 50.5%, rgba(10, 10, 15, 0.92) 100%);
            border: 1px solid var(--gold-faint); border-radius: 10px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.6);
            text-shadow: 0 0 14px rgba(236, 208, 154, 0.35);
        }
        .flip-card span::after {
            content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
            background: rgba(0, 0, 0, 0.7); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07);
        }
        .flip-card small { color: var(--gold); letter-spacing: 0.2em; font-size: 10px; margin-top: 7px; }

        /* narrow phones (360-400px wide): slightly smaller cards so the timer never touches the round buttons */
        @media (max-width: 400px) {
            .live-timer { gap: 7px; }
            .flip-card span { padding: 9px 7px; font-size: 1.3rem; }
        }

        @media (max-width: 340px) {
            .live-timer { gap: 5px; }
            .flip-card span { padding: 8px 5px; font-size: 1.1rem; }
        }

        /* floating round buttons */
        .action-buttons { top: calc(20px + env(safe-area-inset-top, 0px)); right: calc(20px + env(safe-area-inset-right, 0px)); }
        .action-btn {
            position: relative; color: #fff6e0; border: 1px solid var(--gold-soft);
            background: radial-gradient(120% 120% at 30% 18%, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.04) 62%), rgba(12, 12, 18, 0.55);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.28);
            transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
        }
        .action-btn i { filter: drop-shadow(0 0 6px rgba(236, 208, 154, 0.5)); }
        .action-btn:active { transform: scale(0.92); }
        .action-btn::after {
            content: ""; position: absolute; left: -5px; right: -5px; top: -5px; bottom: -5px;
            border-radius: 50%; border: 1px solid var(--gold-soft); opacity: 0; pointer-events: none;
        }
        #openDiary::after, #openReply::after { animation: vipRing 3.8s ease-out infinite; }
        #openReply::after { animation-delay: 1.3s; }
        @keyframes vipRing { 0% { transform: scale(0.82); opacity: 0; } 25% { opacity: 0.75; } 100% { transform: scale(1.4); opacity: 0; } }
        @media (hover: hover) {
            .action-btn:hover { transform: translateY(-2px) scale(1.06); border-color: var(--gold); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 22px rgba(236, 208, 154, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
        }

        /* music button (icon only): bars dance while the song plays */
        .music-btn .eq { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 16px; width: 20px; }
        .music-btn .eq b { display: block; width: 3px; height: 16px; border-radius: 2px; background: currentColor; transform-origin: 50% 100%; transform: scaleY(0.28); transition: transform 0.3s ease; }
        .music-btn.on .eq b { animation: vipEq 1.1s ease-in-out infinite; }
        .music-btn.on .eq b:nth-child(2) { animation-delay: -0.35s; }
        .music-btn.on .eq b:nth-child(3) { animation-delay: -0.7s; }
        @keyframes vipEq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
        .music-btn.off { opacity: 0.6; }
        .music-btn.off .eq::after {
            content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 2px; margin-top: -1px;
            background: currentColor; border-radius: 2px; transform: rotate(-40deg); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
        }
        .music-btn.wait { border-color: var(--gold); }
        .music-btn.wait::after { border-color: var(--gold); animation: vipRing 1.7s ease-out infinite; }

        /* glass panels (diary + message box) */
        .glass-panel {
            background: linear-gradient(160deg, rgba(24, 24, 34, 0.9) 0%, rgba(8, 8, 13, 0.94) 100%);
            -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid var(--gold-faint);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        #diarySidebar {
            border-left: 1px solid var(--gold-soft); box-shadow: -24px 0 60px rgba(0, 0, 0, 0.55);
            visibility: hidden; transition: right 0.55s var(--ease-out), visibility 0s linear 0.55s;
            scrollbar-width: thin; scrollbar-color: rgba(236, 208, 154, 0.4) transparent;
        }
        #diarySidebar.open { visibility: visible; transition: right 0.55s var(--ease-out), visibility 0s; }
        #diarySidebar::-webkit-scrollbar-thumb { background: rgba(236, 208, 154, 0.4); }
        #replyModal {
            visibility: hidden; transition: transform 0.5s var(--ease-out), opacity 0.4s ease, visibility 0s linear 0.5s;
        }
        #replyModal.open { visibility: visible; transition: transform 0.5s var(--ease-out), opacity 0.4s ease, visibility 0s; }

        .sidebar-title {
            position: relative; border-bottom-color: transparent; letter-spacing: 0.04em;
            background: linear-gradient(90deg, #fff3d6, var(--gold)); -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        .sidebar-title::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
            background: linear-gradient(90deg, var(--gold-soft), rgba(236, 208, 154, 0));
        }
        .close-btn {
            z-index: 3; width: 38px; height: 38px; padding: 0; top: 12px; right: 14px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; line-height: 1;
            background: rgba(255, 255, 255, 0.06); transition: background 0.25s ease, transform 0.25s ease, color 0.25s ease;
        }
        .close-btn:active { transform: scale(0.9); }
        @media (hover: hover) { .close-btn:hover { background: rgba(236, 208, 154, 0.2); color: var(--gold); } }

        .memory-btn {
            border-radius: 3px 12px 12px 3px; letter-spacing: 0.01em;
            background: linear-gradient(90deg, rgba(163, 194, 255, 0.11), rgba(255, 255, 255, 0.03));
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }
        .memory-btn:active { transform: scale(0.985); }
        .memory-btn.active {
            border-left-color: var(--gold); color: #fff6e0;
            background: linear-gradient(90deg, rgba(236, 208, 154, 0.2), rgba(255, 255, 255, 0.04));
        }
        @media (hover: hover) { .memory-btn:hover { transform: translateX(4px); color: #fff; } }

        .memory-display {
            padding-left: 14px; border-left: 2px solid var(--gold-soft); text-wrap: pretty;
            background: linear-gradient(90deg, rgba(236, 208, 154, 0.07), rgba(236, 208, 154, 0));
        }
        .memory-display:empty { border-left-color: transparent; background: none; }
        .memory-display.swap { animation: vipText 0.9s var(--ease-out) both; }
        @keyframes vipText { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }

        .reply-textarea { transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease; }
        .reply-textarea::placeholder { color: rgba(255, 255, 255, 0.45); }
        .reply-textarea:focus {
            outline: none; border-color: var(--gold-soft); background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(236, 208, 154, 0.12), 0 0 26px rgba(236, 208, 154, 0.12);
        }
        .send-btn {
            background: linear-gradient(135deg, rgba(255, 188, 122, 0.18), rgba(255, 188, 122, 0.04));
            transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.3s ease;
        }
        .send-btn:active { transform: scale(0.97); }
        .send-btn i { display: inline-block; animation: vipBeat 1.7s ease-in-out infinite; }
        @keyframes vipBeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.25); } 28% { transform: scale(1); } 42% { transform: scale(1.18); } 56% { transform: scale(1); } }
        @media (hover: hover) { .send-btn:hover { background: linear-gradient(135deg, rgba(255, 188, 122, 0.34), rgba(255, 188, 122, 0.12)); box-shadow: 0 0 28px rgba(255, 188, 122, 0.35); } }
        #replyStatus { animation: vipText 0.8s var(--ease-out) both; }

        /* people who switched animations off keep a calm version of the new effects */
        @media (prefers-reduced-motion: reduce) {
            .bg-image { transform: none; transition: opacity 0.6s ease; }
            .action-btn::after, .send-btn i { animation: none; }
            .emotions-text .vl { animation-duration: 0.01s; animation-delay: 0s; filter: none; }
        }

    </style>
</head>

hCLj/7UkVsaarlSgmzi4OTXXNyWidWsv2kYjf6TcQIS2Lg==";
        const ITERATIONS = 600000;

        function fromBase64(text) {
            return Uint8Array.from(atob(text), (ch) => ch.charCodeAt(0));
        }

        async function unlock(password) {
            const raw = fromBase64(CIPHER);
            const salt = raw.slice(0, 16);
            const iv = raw.slice(16, 28);
            const data = raw.slice(28);
            const baseKey = await crypto.subtle.importKey(
                "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
            );
            const key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
                baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
            );
            const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
            return { content: JSON.parse(new TextDecoder().decode(plain)), key: key };
        }

        let savedPassword = null;
        try { savedPassword = sessionStorage.getItem("gvccKey"); } catch (e) { savedPassword = null; }

        // The (encrypted) photo starts downloading while the password is being checked,
        // so the two waits overlap. Nobody who is not logged in downloads it.
        const photoRequest = savedPassword
            ? fetch("n.dat").then((res) => res.arrayBuffer()).catch(() => null)
            : null;

        let content = null;
        let aesKey = null;
        try {
            if (savedPassword) {
                const opened = await unlock(savedPassword);
                content = opened.content;
                aesKey = opened.key;
            }
        } catch (e) { content = null; }

        if (!content) {
            // Not logged in with the right password: show the normal offline notice.
            location.replace("dashboard.html");
            await new Promise(() => {});
        }

        const world = document.getElementById("secretWorld");
        world.innerHTML = content.html;
        world.style.display = "block";
        const loader = document.getElementById("vipLoader");
        if (loader) { loader.remove(); }

        // Background photo: decrypted in the background. The music and the buttons never wait for it.
        async function showPhoto() {
            try {
                let buffer = photoRequest ? await photoRequest : null;
                if (!buffer) { buffer = await (await fetch("n.dat")).arrayBuffer(); }
                const bytes = new Uint8Array(buffer);
                const image = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: bytes.slice(0, 12) }, aesKey, bytes.slice(12)
                );
                const head = new Uint8Array(image, 0, 4);
                const type = (head[0] === 0x89 && head[1] === 0x50) ? "image/png" : "image/webp";
                const imageUrl = URL.createObjectURL(new Blob([image], { type: type }));
                // Decode first, so the photo fades in smoothly instead of popping in.
                try { const probe = new Image(); probe.src = imageUrl; await probe.decode(); } catch (e) { }
                const bg = world.querySelector(".bg-image");
                if (bg) { bg.style.backgroundImage = `url("${imageUrl}")`; }
            } catch (e) { /* the page still works without the background */ }
            world.classList.add("vip-ready");
        }
        showPhoto();

        // 🎵 MUSIC SYSTEM LOGIC 🎵
        // Rules: the song starts as soon as the browser allows it (or on the first tap),
        // songs fade into each other, and if the browser or phone stops the song by itself
        // the next tap anywhere starts it again.
        const VOLUME = 0.2;
        const audios = ["bgMusic", "diaryMusic", "pankhMusic"].map((id) => document.getElementById(id));
        audios.forEach((a) => { a.volume = VOLUME; });
        let currentAudio = document.getElementById("bgMusic");
        let userMuted = false;              // true only when the person pressed the music button
        let fadeCounter = 0;
        const musicBtn = document.getElementById("musicBtn");

        function showMusicState(state) {    // "on" | "wait" | "off"
            if (!musicBtn) { return; }
            musicBtn.classList.remove("on", "wait", "off");
            musicBtn.classList.add(state);
        }

        // Our own pause() calls are marked, so a pause done by the browser can be told apart.
        function pauseTrack(a) {
            if (a.paused) { return; }
            a._ours = true;
            a.pause();
        }

        function fade(a, from, to, ms, done) {
            const id = ++fadeCounter;
            a._fade = id;
            const startedAt = performance.now();
            const timer = setInterval(() => {
                if (a._fade !== id) { clearInterval(timer); return; }
                const t = Math.min(1, (performance.now() - startedAt) / ms);
                a.volume = Math.max(0, Math.min(1, from + (to - from) * t));
                if (t >= 1) { clearInterval(timer); if (done) { done(); } }
            }, 40);
        }

        function playTrack(a) {
            if (userMuted) { return Promise.resolve(false); }
            let promise = null;
            try { promise = a.play(); } catch (e) { promise = null; }
            if (!promise) { return Promise.resolve(true); }
            return promise.then(() => {
                if (a === currentAudio) { showMusicState("on"); }
                return true;
            }).catch((err) => {
                if (err && err.name === "AbortError") { return false; }   // we switched song a moment later
                if (a === currentAudio) { showMusicState("wait"); armUnlock(); }
                return false;
            });
        }

        function startTrack(a, withFade) {
            a._fade = ++fadeCounter;                     // cancels a fade-out still running on this song
            if (withFade && a.paused) { a.volume = 0; } else if (!withFade) { a.volume = VOLUME; }
            return playTrack(a).then((ok) => {
                if (!ok) { a.volume = VOLUME; return ok; }
                if (a === currentAudio && a.volume < VOLUME) { fade(a, a.volume, VOLUME, 800); }
                return ok;
            });
        }

        function switchAudio(newAudioId) {
            const next = document.getElementById(newAudioId);
            const prev = currentAudio;
            currentAudio = next;
            if (prev !== next) {
                fade(prev, prev.volume, 0, 450, () => { pauseTrack(prev); prev.volume = VOLUME; });
            }
            startTrack(next, true);
        }

        // If the browser blocks the song, wait for the first tap / key press and start it then.
        let unlockArmed = false;
        function isControl(el) {
            return !!(el && el.closest && el.closest("button, a, input, textarea, select, label, [onclick]"));
        }
        function tryUnlock() {
            if (userMuted) { return; }
            if (!currentAudio.paused) { disarmUnlock(); return; }
            playTrack(currentAudio).then((ok) => { if (ok) { disarmUnlock(); } });
        }
        function onTouchEnd(e) { if (!isControl(e.target)) { tryUnlock(); } }
        function armUnlock() {
            if (unlockArmed) { return; }

        function disarmUnlock() {
            unlockArmed = false;
            document.removeEventListener("click", tryUnlock);
            document.removeEventListener("keydown", tryUnlock);
            document.removeEventListener("touchend", onTouchEnd);
        }

        audios.forEach((a) => {
            a.addEventListener("playing", () => {
                a._retries = 0;
                if (a === currentAudio) { showMusicState("on"); }
            });
            a.addEventListener("pause", () => {
                if (a._ours) { a._ours = false; return; }
                // Not paused by us (phone call, another app took the sound, ...): next tap starts it again.
                if (a === currentAudio && !document.hidden && !userMuted) { showMusicState("wait"); armUnlock(); }
            });
            a.addEventListener("error", () => {
                a._retries = (a._retries || 0) + 1;
                if (a._retries > 3) { return; }
                setTimeout(() => {
                    a.load();
                    if (a === currentAudio && !document.hidden) { startTrack(a, true); }
                }, 1500);
            });
        });

        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                audios.forEach(pauseTrack);
            } else if (!userMuted) {
                startTrack(currentAudio, true);
            }
        });

        if (musicBtn) {
            musicBtn.addEventListener("click", () => {
                if (!userMuted && !currentAudio.paused) {
                    userMuted = true;
                    audios.forEach(pauseTrack);
                    showMusicState("off");
                } else {
                    userMuted = false;
                    startTrack(currentAudio, true);
                }
            });
        }

        startTrack(currentAudio, true);

        // Last memory button
        const lastBtn = document.getElementById('lastMemoryBtn');
        if (lastBtn) {
            lastBtn.onclick = function () { window.showMemory(content.last); };
        }

        // Firebase is loaded only when a reply is sent
        const firebaseConfig = {
            apiKey: "AIzaSyBJX_dyLK80p2rNqSVvGY67TpWV7e_UdPI",
            authDomain: "gvcc-database.firebaseapp.com",
            projectId: "gvcc-database",
            storageBucket: "gvcc-database.firebasestorage.app",
            messagingSenderId: "1063216875940",
            appId: "1:1063216875940:web:a4ee2f39b01896b44c5931"
        };

        let firebasePromise = null;
        function getFirebase() {
            if (!firebasePromise) {
                firebasePromise = (async () => {
                    const appModule = await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js");
                    const storeModule = await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js");
                    const app = appModule.initializeApp(firebaseConfig);
                    return { db: storeModule.getFirestore(app), collection: storeModule.collection, addDoc: storeModule.addDoc };
                })();
            }
            return firebasePromise;
        }

        // UI Open/Close Logic
        const diarySidebar = document.getElementById('diarySidebar');
        const replyModal = document.getElementById('replyModal');

        document.getElementById('openDiary').addEventListener('click', () => {
            diarySidebar.classList.add('open');
            switchAudio('diaryMusic');
        });

        document.getElementById('closeDiary').addEventListener('click', () => {
            diarySidebar.classList.remove('open');
            switchAudio('bgMusic');
        });

        document.getElementById('openReply').addEventListener('click', () => {
            replyModal.classList.add('open');
            switchAudio('pankhMusic');
        });

        document.getElementById('closeReply').addEventListener('click', () => {
            replyModal.classList.remove('open');
            switchAudio('bgMusic');
        });

        window.showMemory = function (text) {
            const box = document.getElementById('memoryDisplay');
            box.innerText = `"${text}"`;
            box.classList.remove('swap');
            void box.offsetWidth;
            box.classList.add('swap');
        };

        // The memory that is open right now gets a highlight
        document.getElementById('memoryList').addEventListener('click', (e) => {
            const btn = e.target.closest('.memory-btn');
            if (!btn) { return; }
            document.querySelectorAll('#memoryList .memory-btn.active').forEach((x) => x.classList.remove('active'));
            btn.classList.add('active');
        });

        // Save the reply in Firebase
        document.getElementById('sendReplyBtn').addEventListener('click', async function () {
            let msg = document.getElementById('replyMessage').value.trim();
            if (msg === "") return;

            let btn = this;
            btn.innerText = "Bhej raha hoon...";

            try {
                const fb = await getFirebase();
                await fb.addDoc(fb.collection(fb.db, "replies_from_2357"), {
                    message: msg,
                    timestamp: new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })
                });

                document.getElementById('replyMessage').value = "";
                btn.innerHTML = 'Message Bhej Do <i class="fa-solid fa-heart"></i>';
                document.getElementById('replyStatus').style.display = "block";

                setTimeout(() => {
                    replyModal.classList.remove('open');
                    document.getElementById('replyStatus').style.display = "none";
                    switchAudio('bgMusic');
                }, 3000);

            } catch (error) {
                console.error("Firebase Error: ", error);
                btn.innerText = "Error! Phir se try karein.";
            }
        });
</script>
</body>
</html>
