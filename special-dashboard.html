<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- MOBILE ZOOM LOCK: Isse page zoom nahi hoga aur fit rahega -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sirf Tumhari Yaad...</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Playfair Display', serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            position: relative;
            touch-action: none; /* Mobile par swipe/scroll/zoom poori tarah band */
        }

        #secretWorld { display: none; width: 100%; height: 100%; position: relative; }

        /* Background Image - Screen par completely fix rahegi */
        .bg-image {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('n.png.png');
            background-size: cover;
            background-position: center;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Timtimate Taare */
        .twinkling-stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
            background-image: 
                radial-gradient(2px 2px at 15% 25%, #ffffff88, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40% 10%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80% 30%, #ffffff55, rgba(0,0,0,0));
            background-size: 200px 200px;
            animation: twinkle 4s infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }

        /* --- FIXED PERFECT SHOOTING STARS --- */
        .star-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Ab taara aur uski tail ek hi direction me properly align honge */
        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--star-color, #fff);
            box-shadow: 0 0 10px var(--star-color, #fff);
            opacity: 0;
            /* 135deg ka matlab hai Top-Right se Bottom-Left ki taraf cross karna */
            animation: fall 4s infinite linear;
        }

        /* Roshni (Tail) theek taare ke peeche rahegi */
        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 50%; /* Tail taare ke center se shuru hokar piche ki taraf jayegi */
            transform: translateY(-50%);
            width: 120px; /* Roshni ki lambai */
            height: 1.5px;
            /* Transparent se lekar color tak ka gradient */
            background: linear-gradient(to right, transparent, var(--star-color, #fff));
        }

        @keyframes fall {
            /* Taara sirf X disha me aage badhega, aur rotate(135deg) use sahi angle de dega */
            0% { transform: rotate(135deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: rotate(135deg) translateX(250px); opacity: 0; } 
            100% { transform: rotate(135deg) translateX(250px); opacity: 0; }
        }

        /* Original 7 Stars (Aapke coordinates ke sath) */
        .s1 { left: 24.2%; top: 31.1%; --star-color: #a3c2ff; animation-delay: 0s; }
        .s2 { left: 38.3%; top: 34.1%; --star-color: #ffbc7a; animation-delay: 2s; }
        .s3 { left: 50.8%; top: 44.5%; --star-color: #d4e1ff; animation-delay: 1.5s; }
        .s4 { left: 41.1%; top: 63.2%; --star-color: #ffa3e6; animation-delay: 3.5s; }
        .s5 { left: 77.9%; top: 0%;    --star-color: #ffffff; animation-delay: 1s; }
        .s6 { left: 92.8%; top: 5.7%;  --star-color: #b0ffdb; animation-delay: 4.5s; }
        .s7 { left: 96%;   top: 50.9%; --star-color: #ffc987; animation-delay: 2.8s; }

        /* Naye 5 Stars (More magic effect) */
        .s8 { left: 60%; top: 15%; --star-color: #ffffff; animation-delay: 0.5s; animation-duration: 5s; }
        .s9 { left: 85%; top: 25%; --star-color: #a3c2ff; animation-delay: 3s; animation-duration: 3.5s; }
        .s10 { left: 70%; top: 55%; --star-color: #ffbc7a; animation-delay: 1.2s; animation-duration: 4.2s; }
        .s11 { left: 45%; top: 10%; --star-color: #d4e1ff; animation-delay: 4.8s; animation-duration: 3.8s; }
        .s12 { left: 30%; top: 60%; --star-color: #ffa3e6; animation-delay: 2.5s; animation-duration: 4.5s; }

        /* --- WINDY LEAVES EFFECT --- */
        .falling-leaves {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            width: 8px; height: 12px;
            background: #080808; 
            border-radius: 0 10px 0 10px;
            opacity: 0.7;
            animation: drift 7s infinite ease-in-out;
        }

        .l1 { left: 5%; top: 10%; animation-duration: 8s; animation-delay: 0s; }
        .l2 { left: 15%; top: -5%; animation-duration: 6s; animation-delay: 2s; }
        .l3 { left: 10%; top: 20%; animation-duration: 9s; animation-delay: 4s; }
        .l4 { left: 20%; top: 15%; animation-duration: 7s; animation-delay: 1s; }

        @keyframes drift {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translate(80px, 200px) rotate(180deg); } 
            100% { transform: translate(150px, 400px) rotate(360deg); opacity: 0; }
        }

        /* Aapke Jazbaat */
        .emotions-text {
            position: absolute;
            bottom: 8%; 
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            color: #e5e7eb;
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            line-height: 1.4;
            text-align: center;
            z-index: 5;
            text-shadow: 2px 2px 15px rgba(0,0,0,1), -1px -1px 10px rgba(0,0,0,1);
            opacity: 0;
            animation: fadeInText 5s forwards;
            animation-delay: 2.5s; 
        }
        @keyframes fadeInText { to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="secretWorld">
        <div class="bg-image"></div>
        <div class="twinkling-stars"></div>

        <!-- 12 Shooting Stars Array -->
        <div class="star-container">
            <div class="shooting-star s1"></div>
            <div class="shooting-star s2"></div>
            <div class="shooting-star s3"></div>
            <div class="shooting-star s4"></div>
            <div class="shooting-star s5"></div>
            <div class="shooting-star s6"></div>
            <div class="shooting-star s7"></div>
            <div class="shooting-star s8"></div>
            <div class="shooting-star s9"></div>
            <div class="shooting-star s10"></div>
            <div class="shooting-star s11"></div>
            <div class="shooting-star s12"></div>
        </div>

        <div class="falling-leaves">
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>
        </div>

        <div class="emotions-text">
            "Aaj 40 din guzar gaye...<br>
            Aur is akelepan mein bas yehi lagta hai,<br>
            ki shayad kahin tum bhi is aasman ko dekh rahi hogi..."
        </div>
    </div>

    <script>
        window.onload = function() {
            let loggedInRoll = localStorage.getItem("studentRoll");
            if (loggedInRoll !== "2357") {
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("secretWorld").style.display = "block";
            }
        };
    </script>
</body>
</html>
