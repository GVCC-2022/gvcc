        .search-container button { background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .search-container button:active { transform: scale(0.95); }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }

        .table-wrapper { overflow-x: auto; background: #020617; border-radius: 12px; border: 1px solid #334155; }

        /* Table padding adjusted for Mobile */
        th { background: #0f172a; color: #fbbf24; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 12px 10px; border-bottom: 2px solid #334155; }
        td { padding: 12px 10px; border-bottom: 1px solid #1e293b; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        
        /* Rank Styles */
        .rank-1 { background: rgba(251, 191, 36, 0.08) !important; border-left: 3px solid #fbbf24; }
        .rank-2 { background: rgba(148, 163, 184, 0.08) !important; border-left: 3px solid #94a3b8; }

        .rank-text { text-align: center; font-weight: 900; font-size: 14px; color: #fbbf24; }

        onSnapshot(collection(db, "vip_results_status"), (snapshot) => {

        });

        // ⚙️ RENDER MOBILE OPTIMIZED TABLE WITH SMART RANKING
        window.showClass = function(className) {
            currentTab = className;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target && event.target.classList) { event.target.classList.add('active'); }

            const tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = ''; 

            let rawData = [];
            if (className === '10th') rawData = [...class10Data];
            else if (className === '9th') rawData = [...class9Data];
            else if (className === '8th') rawData = [...class8Data];

            if (rawData.length === 0) return;

            // 🏆 Sort Descending
            rawData.sort((a, b) => {
                let valA = (a.marks === "WH" || a.marks === "--" || a.marks === 0 || a.marks === "0") ? -1 : parseFloat(a.marks);
                let valB = (b.marks === "WH" || b.marks === "--" || b.marks === 0 || b.marks === "0") ? -1 : parseFloat(b.marks);
                return valB - valA;
            });

            let rank = 0;
            let previousMarks = null;

            rawData.forEach((student, index) => {

                previousMarks = currentMarks;

                let rankText = ""; let rowClass = "";

                        </div>
                    `;

                }

                let row = `

                        <td class="rank-text">${rankText}</td>
                        <td>

                            </div>
                        </td>
                        <td>${appStatus}</td>

            let marks = student.marks;
            let isPassed = parseFloat(marks) >= student.passMark;

        }

        // 🔍 SEARCH LOGIC
        window.searchByCode = function() {
            let codeInput = document.getElementById("teacherSearchCode").value.trim().toUpperCase();
            if(!codeInput) return alert("Please enter a code!");

            let found = window.allStudentsGlobal.find(s => s.code === codeInput);
            if(found) {
                document.getElementById("searchName").innerText = found.name;
                document.getElementById("searchRoll").innerText = `Roll: ${found.roll} | Max: ${found.max}`;
                
                let isAbsent = (found.marks === 0 || found.marks === "0");
                document.getElementById("searchMarks").innerText = isAbsent ? "ABS" : found.marks;
                
                let isPassed = parseFloat(found.marks) >= found.passMark;
                let statusEl = document.getElementById("searchStatus");
                
                if (isAbsent) { statusEl.innerText = "Status: ABSENT"; statusEl.style.color = "#ef4444"; }
                else if(found.marks === "WH" || found.marks === "--") { statusEl.innerText = "Status: " + found.marks; statusEl.style.color = "#f59e0b"; }
                else { statusEl.innerText = "Status: " + (isPassed ? "PASSED" : "FAILED"); statusEl.style.color = isPassed ? "#10b981" : "#ef4444"; }

                document.getElementById("searchResultModal").style.display = "flex";
            } else { alert("⚠️ Invalid Code!"); }
        }

        window.closeSearchModal = function() { document.getElementById("searchResultModal").style.display = "none"; document.getElementById("teacherSearchCode").value = ""; }
        window.onload = function() { window.showClass('10th'); };
    </script>
</body>
</html>
