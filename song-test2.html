<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GVCC song test 2</title>
<style>
  body { margin: 0; padding: 14px; font-family: system-ui, sans-serif; background: #fff; color: #111; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  button { font-size: 19px; padding: 15px 16px; width: 100%; border: 0; border-radius: 12px; background: #0b6bcb; color: #fff; margin: 4px 0; }
  button:disabled { background: #888; }
  #no { background: #c0392b; }
  #yes { background: #1e8e3e; }
  #now { margin: 12px 0; font-size: 20px; font-weight: 600; min-height: 56px; }
  #ask { display: none; }
  #sum { margin: 12px 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  #sum b { color: #0b6bcb; }
  pre { font-size: 10px; line-height: 1.3; background: #f3f3f3; padding: 8px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>GVCC song test 2</h1>
<div id="now">Neela button dabao. Har test mein awaaz aayegi, tab neeche ke hare/laal button se batao.</div>
<button id="go">Test shuru karo (2 minute)</button>
<div id="ask"><button id="yes">Haan, awaaz poori aayi</button><button id="no">Nahi, ruk gayi / nahi aayi</button></div>
<div id="sum"></div>
<pre id="log"></pre>

<script>
(function () {
  var now = document.getElementById("now");
  var sum = document.getElementById("sum");
  var logEl = document.getElementById("log");
  var askBox = document.getElementById("ask");
  var T0 = performance.now();
  var lines = [];
  function say(m) { lines.push(m); sum.innerHTML = lines.join("\n"); }
  function log(m) { logEl.textContent += ((performance.now() - T0) / 1000).toFixed(1) + "s " + m + "\n"; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function bust(u) { return u + "?t=" + Date.now() + Math.floor(Math.random() * 1000); }

  // what kind of device is this
  var c = navigator.connection || {};
  var uad = navigator.userAgentData;
  function deviceLines() {
    say("<b>Phone:</b> " + navigator.userAgent.replace("Mozilla/5.0 ", "").slice(0, 100));
    say("<b>Device:</b> touch=" + navigator.maxTouchPoints + " screen=" + screen.width + "x" + screen.height + " dpr=" + devicePixelRatio +
        (uad ? " platform=" + uad.platform + " mobile=" + uad.mobile : "") + " net=" + (c.effectiveType || "?") + " " + (c.downlink || "?") + "Mbps");
    say("<b>Page:</b> visible=" + document.visibilityState + " focus=" + document.hasFocus());
  }

  // ask the person: did the sound come through?
  var answerResolve = null;
  function ask(text) {
    now.textContent = text;
    askBox.style.display = "block";
    return new Promise(function (res) { answerResolve = res; });
  }
  document.getElementById("yes").onclick = function () { if (answerResolve) { answerResolve("HAAN"); answerResolve = null; } };
  document.getElementById("no").onclick = function () { if (answerResolve) { answerResolve("NAHI"); answerResolve = null; } };
  function closeAsk() { askBox.style.display = "none"; answerResolve = null; }

  // Test with a real <audio> or <video> element
  async function elementTest(label, el, url, seconds, muted, viaGraph) {
    var pauses = 0, errors = 0, played = false, stopping = false;
    el.loop = true; el.volume = 0.3; el.muted = !!muted; el.preload = "auto";
    el.addEventListener("pause", function () { if (stopping) { return; } pauses++; log("  " + label + " PAUSE t=" + el.currentTime.toFixed(1)); });
    el.addEventListener("playing", function () { played = true; log("  " + label + " playing"); });
    el.addEventListener("error", function () { errors++; log("  " + label + " ERROR " + (el.error && el.error.code)); });
    var ctx = null;
    if (viaGraph) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      ctx = new Ctx(); try { await ctx.resume(); } catch (e) { }
      var node = ctx.createMediaElementSource(el);
      var g = ctx.createGain(); g.gain.value = 1; node.connect(g); g.connect(ctx.destination);
    }
    el.src = bust(url);
    var answerP = muted ? Promise.resolve("-") : ask("Ab chal raha hai: " + label + "\nAwaaz aa rahi hai? Batao.");
    if (muted) { now.textContent = "Ab chal raha hai: " + label + " (bina awaaz ke)"; }
    var err = "";
    try { await el.play(); } catch (e) { err = e.name; }
    var started = performance.now(), heard = 0, prev = el.currentTime;
    for (var i = 0; i < seconds * 2; i++) {
      await wait(500);
      var t = el.currentTime;
      if (!el.paused && t - prev > 0.25) { heard += 0.5; }
      prev = t;
    }
    var stillPlaying = !el.paused;
    stopping = true;
    el.pause(); el.removeAttribute("src"); try { el.load(); } catch (e) { }
    if (ctx) { try { ctx.close(); } catch (e) { } }
    var answer = await Promise.race([answerP, wait(4000).then(function () { return "koi jawab nahi"; })]);
    closeAsk();
    say("<b>" + label + ":</b> " + (err ? "play() roka gaya " + err : "browser ne " + pauses + " baar pause kiya, " + heard.toFixed(0) + "/" + seconds + " sec chala, ab tak chal raha tha: " + (stillPlaying ? "haan" : "nahi")) + (muted ? "" : " | tumne kaha: " + answer));
  }

  // Test with the Web Audio API (the file is fully loaded first, then played from memory)
  async function bufferTest(label, url, seconds) {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    try { await ctx.resume(); } catch (e) { }
    var answerP = ask("Ab chal raha hai: " + label + "\nAwaaz aa rahi hai? Batao.");
    var info = "";
    try {
      var data = await (await fetch(bust(url), { cache: "no-store" })).arrayBuffer();
      var buf = await ctx.decodeAudioData(data);
      var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      var g = ctx.createGain(); g.gain.value = 0.3; src.connect(g); g.connect(ctx.destination); src.start();
      var t0 = ctx.currentTime;
      await wait(seconds * 1000);
      info = "ctx=" + ctx.state + " chala " + (ctx.currentTime - t0).toFixed(0) + " sec";
      src.stop();
    } catch (e) { info = "fail: " + e; }
    try { ctx.close(); } catch (e) { }
    var answer = await Promise.race([answerP, wait(4000).then(function () { return "koi jawab nahi"; })]);
    closeAsk();
    say("<b>" + label + ":</b> " + info + " | tumne kaha: " + answer);
  }

  async function beepTest() {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    try { await ctx.resume(); } catch (e) { }
    var answerP = ask("Ab chal raha hai: BEEP\nBeep aa raha hai? Batao.");
    var osc = ctx.createOscillator(), g = ctx.createGain();
    g.gain.value = 0.15; osc.frequency.value = 440; osc.connect(g); g.connect(ctx.destination); osc.start();
    await wait(6000);
    osc.stop(); try { ctx.close(); } catch (e) { }
    var answer = await Promise.race([answerP, wait(4000).then(function () { return "koi jawab nahi"; })]);
    closeAsk();
    say("<b>Beep (6 sec):</b> tumne kaha: " + answer);
  }

  var btn = document.getElementById("go");
  btn.addEventListener("click", async function () {
    btn.disabled = true; btn.textContent = "Test chal raha hai...";
    lines = []; logEl.textContent = ""; T0 = performance.now();
    deviceLines();
    var SMALL = "songs/rahna.lite.mp3", BIG = "songs/awara.lite.mp3";
    await beepTest();
    await elementTest("A. normal audio (jaisa ab hai)", new Audio(), SMALL, 8, false, false);
    await elementTest("B. audio, bina awaaz (muted)", new Audio(), SMALL, 6, true, false);
    var v = document.createElement("video"); v.setAttribute("playsinline", ""); v.style.display = "none"; document.body.appendChild(v);
    await elementTest("C. video element mein song", v, SMALL, 8, false, false);
    await bufferTest("D. Web Audio (song memory se)", SMALL, 8);
    await elementTest("E. audio + Web Audio mix", new Audio(), SMALL, 8, false, true);
    await bufferTest("F. Web Audio, bada song", BIG, 10);
    now.textContent = "TEST POORA. Is poori screen ka screenshot lo (neeche scroll karke log ka bhi) aur bhej do.";
    btn.textContent = "Test poora";
  });
})();
</script>
</body>
</html>
